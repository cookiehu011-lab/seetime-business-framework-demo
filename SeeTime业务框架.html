function moduleLocation(){const config=MODULE_LAYOUT[state.route];if(!config)return null;const section=config.sections.find(x=>x.id===state.moduleSection)||config.sections.find(x=>state.tab&&x.tab===state.tab)||config.sections[0];const view=section.views.find(x=>x[0]===state.moduleView)||section.views[0];return {config,section,view}}

function selectModuleFunction(sectionId,viewId='',focusId=''){if(!can(state.route))return false;const config=MODULE_LAYOUT[state.route],section=config?.sections.find(x=>x.id===sectionId);if(!section)return false;const view=section.views.find(x=>x[0]===viewId)||(!viewId?section.views[0]:null);if(!view)return false;state.moduleSection=section.id;state.moduleView=view[0];state.tab=section.tab;state.filter=state.route==='cameras'?({online:'online',offline:'offline',quality:'quality'}[view[0]]||'all'):state.route==='governance'?({pending:'待确认',progress:'跟进中',archive:'已归档'}[view[0]]||'all'):'all';state.personalFilter=state.route==='personal'&&section.id==='favorites'?'favorite':'all';state.search='';state.selected='';closeOverlay();render();if(focusId)document.getElementById(focusId)?.focus();return true}

return header('感知城市，连接业务','从统一相机入口，进入个人服务与城市治理。',routeButton(icon('pulse')+' 运行中心','operations'))+`<section class="box hero"><div class="hero-header"><div><div class="eyebrow"><i class="live-dot"></i> SEETIME BUSINESS NETWORK</div><h2>一个相机入口，两条独立业务链</h2><p>个人版与治理版分别生产业务数据，各自维护、独立交付。</p></div><div class="hero-meta"><div><b>${number(info().total)}</b><small>已接入相机</small></div><div><b>8</b><small>独立产品模块</small></div><div><b>${info().name}</b><small>当前城市</small></div></div></div><div class="business-flow"><div class="flow-source">${nodeCard('access','城市接入与订阅','城市资源接入、订阅范围与授权周期','RESOURCE ACCESS',`${city().sources.length} 个接入来源`)}${nodeCard('cameras','相机治理','档案治理、在线监控与画面质量','CAMERA OPERATIONS','2 项质量提醒')}</div><div class="flow-bridge" aria-hidden="true"><svg viewBox="0 0 42 300" preserveAspectRatio="none"><path d="M0 150H18V73H42M18 150v77h24" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m35 68 6 5-6 5m0 144 6 5-6 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div><div class="flow-lanes"><section class="product-lane"><div class="lane-title"><strong>01　个人版业务</strong><small>POI 场景运营与个人版相机治理 · 一个应用出口</small></div><div class="lane-content"><div class="producer-stack">${nodeCard('personalProfile','POI 与场景运营','画像 · 相机挂接 · 停车检测','POI TEAM','基础关系配置')}${nodeCard('personalAnalysis','个人版相机治理','图片理解 · 时序检测 · 分析产出','ANALYSIS TEAM','独立任务与数据')}</div><span class="lane-arrow">${icon('arrow')}</span>${nodeCard('personal','SeeTime 个人版','地点近况、趋势与面向个人的分析服务','PERSONAL APP','打开个人版')}</div><div class="lane-note">分析读取相机数据；POI 关系可作为上下文。两团队分别维护各自的数据与任务。</div></section><section class="product-lane gov"><div class="lane-title"><strong>02　治理版业务</strong><small>治理产品团队 · 独立事件链路</small></div><div class="lane-content">${nodeCard('govData','治理版事件生产','检测类型、事件区域、规则配置与事件生成','EVENT PRODUCTION','进入检测工作区')}<span class="lane-arrow">${icon('arrow')}</span>${nodeCard('governance','SeeTime 治理版','城市事件、治理态势与跟进工作','GOVERNANCE APP','打开治理版')}</div></section></div></div><div class="hero-footer"><span>选择模块进入工作区 · 模块权限独立控制</span><span>统一入口 / 城市上下文</span></div></section><div class="home-bottom"><section class="box"><div class="box-title"><h2>运行脉搏</h2>${routeButton('查看运行状态 '+icon('arrow'),'operations','small ghost')}</div><div class="health-overview"><div><div class="health-big">${services().filter(s=>s.state==='运行中').length} <small>/ ${services().length} 可用</small></div><div class="health-caption">${services().filter(s=>s.freshness==='待检查').length} 项数据待检查 · 示例快照</div></div><svg class="sparkline" viewBox="0 0 140 40" aria-hidden="true"><path d="M0 30h15l8-5 10 5 8-14 8 7 11-4 7 5 12-9 8 8 10-17 8 12 13-6 12 8 10-5" stroke="#4bdeb6" fill="none" stroke-width="2"/></svg></div><div class="service-pills">${services().map((s,i)=>`<span class="service-pill ${s.freshness==='待检查'?'warn':''}"><i class="live-dot"></i>${s.shortName}</span>`).join('')}</div></section><section class="box"><div class="box-title"><h2>需要关注</h2><span class="status warn">${city().alerts.filter(a=>a.state==='未确认').length} 项未确认</span></div>${city().alerts.filter(a=>can(a.route)).map(a=>`<div class="alert-line"><span class="alert-mark">!</span><div><b>${a.name}</b><small>${a.desc}</small></div><button class="link-button" data-action="alert-open" data-id="${a.id}">查看 ${icon('chevron')}</button></div>`).join('')}</section></div>`}

function accessPage(){const c=city();const body=header('城市接入与订阅','管理相机来源、订阅范围与授权周期。',btn(icon('plus')+' 新增接入','create-source','','primary'))+`<div class="metrics">${metric('接入相机',number(info().total),'统计为城市级示例数据','camera')}${metric('资源来源',c.sources.length,'平台 / 订阅 / 项目','access')}${metric('有效订阅',c.sources.filter(s=>s.status==='生效中').length,'授权周期内可用','clock')}${metric('需要关注',c.sources.filter(s=>s.status!=='生效中').length,'即将到期或已暂停','bell','amber')}</div>`+tabs([['sources','接入来源'],['subscriptions','城市订阅']]);if((state.tab||'sources')==='subscriptions'){return body+`<section class="box"><div class="toolbar"><h2>当前城市订阅</h2><span class="muted" style="">订阅范围与用户使用权限分别管理</span></div>${table(['来源名称','类型','相机范围','授权有效期','状态',''],c.sources.map(s=>[`<strong>${esc(s.name)}</strong><small>${esc(info().name)} · ${s.id.toUpperCase()}</small>`,esc(s.type),`${number(s.count)} 路`,esc(s.expires),badge(s.status),btn('查看订阅','source-detail',s.id,'small ghost')]))}</section>`}
return body+`<div class="source-grid">${c.sources.map(s=>`<article class="box source-card">${icon(s.type==='资源订阅'?'layers':'access')}<h3>${esc(s.name)}</h3><small class="muted">${esc(s.type)} · ${esc(info().name)}</small><div class="source-number mono">${number(s.count)}<small>路相机</small></div><div class="source-status">${badge(s.status)}${btn('查看接入 '+icon('arrow'),'source-detail',s.id,'small ghost')}</div></article>`).join('')}</div><section class="box"><div class="box-title"><div><h2>接入范围</h2><p>来源提供可用相机，产品按各自业务范围配置与使用。</p></div></div>${table(['城市 / 区域','资源说明','状态'],info().districts.map((d,i)=>[`<strong>${esc(info().name)} · ${d}</strong>`,['城市平台直连资源','资源订阅与授权相机','项目试点区域资源'][i],badge('可用')]))}</section>`}
function camerasPage(){const cameras=city().cameras;const list=cameras.filter(c=>(state.filter==='all'||state.filter==='online'&&c.state==='在线'||state.filter==='offline'&&c.state==='离线'||state.filter==='quality'&&c.quality!=='清晰')&&(!state.search||`${c.name}${c.id}${c.district}`.includes(state.search)));return header('相机治理','维护相机档案，持续掌握在线与画面质量。',btn(icon('refresh')+' 执行示例检查','check-all','','primary'))+`<div class="metrics">${metric('已接入相机',number(info().total),'以下显示 6 路可操作样例','camera')}${metric('在线率',(info().online/info().total*100).toFixed(1)+'%','城市级运行示例','pulse','green')}${metric('画面待检查',cameras.filter(c=>c.quality!=='清晰').length,'当前示例清单','bell','amber')}${metric('离线相机',cameras.filter(c=>c.state==='离线').length,'当前示例清单','camera','red')}</div><section class="box"><div class="toolbar">${searchForm('搜索相机名称、区域或编号')}<div class="chips">${chips([['all','全部'],['online','在线'],['offline','离线'],['quality','画面异常']])}<button class="chip ${state.view==='grid'?'active':''}" data-action="view-mode">${state.view==='grid'?'列表视图':'画面视图'}</button></div></div>${state.view==='grid'?`<div class="camera-grid">${list.map(c=>`<article class="camera-tile">${scene()}<div class="camera-info"><h3>${esc(c.name)}</h3><small>${esc(c.id)} · ${esc(c.district)}</small><div class="camera-bottom">${badge(c.state==='离线'?'离线':c.quality)}${btn('详情','camera-detail',c.id,'small ghost')}</div></div></article>`).join('')||'<div class="empty">没有符合条件的相机</div>'}</div>`:table(['相机名称 / 编号','所属区域','接入来源','在线状态','画面质量',''],list.map(c=>[`<strong>${esc(c.name)}</strong><small class="mono">${esc(c.id)}</small>`,esc(c.district),esc(c.source),badge(c.state),badge(c.quality),btn('查看','camera-detail',c.id,'small ghost')]))}</section>`}
function personalProfilePage(){const c=city(),tab=state.tab||'poi';const pois=c.pois.filter(p=>!state.search||`${p.name}${p.category}`.includes(state.search));let main='';if(tab==='parking'){const parking=c.pois.filter(p=>p.category==='停车场');main=`<section class="box"><div class="box-title"><h2>停车检测配置</h2><span class="muted" style="">由 POI 与场景运营团队维护</span></div>${table(['停车场','泊位总数','当前占用','检测频率',''],parking.map(p=>[`<strong>${esc(p.name)}</strong><small>${esc(p.cameraId)}</small>`,`${p.capacity} 个`,`${p.occupied} 个`,`${p.interval} 分钟`,btn('配置检测','edit-parking',p.id,'small ghost')]))}</section>`}else main=`<section class="box"><div class="toolbar">${searchForm('搜索 POI 名称或分类')}<span class="muted" style="">${tab==='binding'?'维护 POI 与相机关系':'维护 POI 分类与画像'}</span></div>${table(tab==='binding'?['POI 名称','当前挂接相机','相机数量','覆盖状态','']:['POI 名称','分类','画像完整度','最近更新',''],pois.map(p=>tab==='binding'?[`<strong>${esc(p.name)}</strong><small>${esc(p.district)}</small>`,`<span class="mono">${esc(p.cameraId)}</span>`,`${p.cameraCount} 路`,badge(p.cameraId?'已挂接':'待配置'),btn('调整挂接','edit-poi',p.id,'small ghost')]:[`<strong>${esc(p.name)}</strong><small>${esc(p.district)}</small>`,esc(p.category),`${p.completeness}%<div class="progress"><i style="width:${p.completeness}%"></i></div>`,esc(p.updated),btn('查看画像','poi-detail',p.id,'small ghost')]))}</section>`;return header('POI 与场景运营','维护 POI 画像、相机挂接和停车检测配置。',tab==='poi'?btn(icon('plus')+' 新增 POI','create-poi','','primary'):'')+`<div class="metrics">${metric('城市 POI',number(info().poiTotal),'当前城市资源','poi')}${metric('画像完整度',Math.round(c.pois.reduce((a,p)=>a+p.completeness,0)/c.pois.length)+'%','示例 POI 平均值','data')}${metric('相机挂接',c.pois.filter(p=>p.cameraId).length,'当前示例 POI','camera')}${metric('停车场',c.pois.filter(p=>p.category==='停车场').length,'检测配置独立维护','pulse')}</div>`+tabs([['poi','POI 画像'],['binding','相机挂接'],['parking','停车检测']])+main}
function personalAnalysisPage(){const c=city(),jobs=c.jobs.filter(j=>!state.search||j.name.includes(state.search)),outputs=c.jobs.filter(j=>j.state==='结果已更新'&&(!state.search||j.name.includes(state.search)));const rows=state.tab==='outputs'?outputs:jobs;return header('个人版相机治理','独立生产图片理解、时序检测及其他分析数据。',state.tab==='outputs'?'':btn(icon('plus')+' 新建分析任务','create-job','','primary'))+`<div class="metrics">${metric('分析任务',c.jobs.length,'当前城市示例','pulse')}${metric('运行中',c.jobs.filter(j=>j.state==='运行中').length,'任务运行状态','data')}${metric('结果待检查',c.jobs.filter(j=>j.state==='待检查').length,'数据新鲜度提醒','bell','amber')}${metric('已更新结果',outputs.length,'个人版应用可读取','chart')}</div><div class="note" style="margin-bottom:18px">分析团队维护任务和结果；POI、相机关系与停车配置由 POI 与场景运营团队维护。</div>`+tabs([['jobs','分析任务'],['outputs','数据产出']])+`<section class="box"><div class="toolbar">${searchForm(state.tab==='outputs'?'搜索分析结果':'搜索分析任务')}<span class="muted" style="">图片理解 · 时序检测 · 综合分析</span></div>${table(state.tab==='outputs'?['数据产出','分析类型','目标地点','更新时间','']:['分析任务','分析类型','目标地点','频率','运行状态','最近更新',''],rows.map(j=>state.tab==='outputs'?[`<strong>${esc(j.name)}</strong>`,esc(j.type),esc(c.pois.find(p=>p.id===j.poiId)?.name||'未关联'),esc(j.updated),btn('查看结果','job-detail',j.id,'small ghost')]:[`<strong>${esc(j.name)}</strong>`,esc(j.type),esc(c.pois.find(p=>p.id===j.poiId)?.name||'未关联'),esc(j.frequency),badge(j.state),esc(j.updated),btn('查看任务','job-detail',j.id,'small ghost')]))}</section>`}

function govDataPage(){const c=city(),tab=state.tab||'configs';let main='';if(tab==='events'){main=`<section class="box"><div class="toolbar"><h2>检测链路事件产出</h2>${btn(icon('play')+' 生成测试样例','create-test-event','','primary')}</div>${table(['事件编号','类型','来源相机','位置','产出时间',''],c.events.map(ev=>[`<strong class="mono">${esc(ev.id)}</strong><small>${ev.test?'测试样例':'演示事件'}</small>`,esc(ev.type),esc(ev.cameraId),esc(ev.location),esc(ev.time),btn('查看','production-event',ev.id,'small ghost')]))}</section>`}else if(tab==='rules'){main=`<section class="box"><div class="toolbar"><h2>事件生成规则</h2>${btn(icon('plus')+' 新建规则','create-rule','','primary')}</div>${table(['规则名称','检测类型','持续时间','置信阈值','状态',''],c.rules.map(r=>[`<strong>${esc(r.name)}</strong>`,esc(r.type),`${r.duration} 分钟`,`${r.threshold}%`,badge(r.enabled?'已启用':'已停用'),btn('编辑规则','edit-rule',r.id,'small ghost')]))}</section>`}else if(tab==='regions'){const r=c.regions.find(r=>r.id===state.selected)||c.regions[0];main=`<div class="master-detail"><div class="selection-list">${c.regions.map(p=>`<button class="selection-card ${r.id===p.id?'active':''}" data-action="select-region" data-id="${p.id}"><h3>${esc(p.name)}</h3><p>${esc(p.cameraId)}</p><span class="selection-foot">${badge('已配置')}<small class="subtle">查看区域 ${icon('chevron')}</small></span></button>`).join('')}</div><section class="box"><div class="box-title"><div><h2>${esc(r.name)}</h2><p>检测区域仅用于治理版事件检测。</p></div>${btn(icon('edit')+' 调整区域','edit-region',r.id,'small')}</div><div class="detail-content">${regionPreview(r)}${detailsGrid([['来源相机',r.cameraId],['覆盖范围',`${r.w}% × ${r.h}%`],['左边界 / 上边界',`${r.x}% / ${r.y}%`],['配置状态','当前浏览器演示配置']])}</div></section></div>`}else{const cfg=c.configs.find(x=>x.id===state.selected)||c.configs[0],r=c.regions.find(r=>r.id===cfg.regionId),rule=c.rules.find(r=>r.id===cfg.ruleId);main=`<div class="master-detail"><div class="selection-list">${c.configs.map(x=>`<button class="selection-card ${cfg.id===x.id?'active':''}" data-action="select-config" data-id="${x.id}"><h3>${esc(x.name)}</h3><p>${esc(x.type)} · ${esc(x.cameraId)}</p><span class="selection-foot">${badge(x.enabled?'已启用':'已停用')}<small class="subtle">检测配置</small></span></button>`).join('')}</div><section class="box"><div class="box-title"><div><h2>${esc(cfg.name)}</h2><p>相机 → 检测区域 → 规则 → 事件产出</p></div>${badge(cfg.enabled?'已启用':'已停用')}</div><div class="detail-content">${regionPreview(r)}${detailsGrid([['检测类型',cfg.type],['来源相机',cfg.cameraId],['检测区域',r.name],['关联规则',rule.name],['持续条件',`${rule.duration} 分钟`],['置信阈值',`${rule.threshold}%`]])}<div class="detail-actions">${btn(icon('edit')+' 编辑配置','edit-config',cfg.id)}${btn(cfg.enabled?'停用此配置':'启用此配置','toggle-config',cfg.id,'ghost')}</div></div></section></div>`}return header('治理版事件生产','独立配置检测类型、事件区域和规则，持续产生治理事件。',tab==='configs'?btn(icon('plus')+' 新增检测配置','create-config','','primary'):'' )+`<div class="metrics">${metric('检测配置',c.configs.length,'当前示例工作区','govern')}${metric('事件区域',c.regions.length,'按相机配置','layers')}${metric('启用规则',c.rules.filter(r=>r.enabled).length,'规则独立维护','data')}${metric('事件产出',c.events.length,'当前可追溯示例','chart')}</div>`+tabs([['configs','检测配置'],['regions','事件区域'],['rules','规则配置'],['events','事件产出']])+main}
function personalPage(){let pois=city().pois.filter(p=>(state.personalFilter==='all'||state.personalFilter==='favorite'&&p.favorite||state.personalFilter===p.category)&&(!state.search||`${p.name}${p.category}`.includes(state.search)));return `<section class="personal-header"><h1>看看此刻的${esc(info().name.replace('市',''))}</h1><p>地点近况、停车信息与城市漫步灵感，从这里开始。</p><div class="personal-tools">${searchForm('搜索你想了解的地点')}<div class="chips">${[['all','为你推荐'],['商圈','商圈'],['景点','景点'],['停车场','停车'],['favorite','我的关注']].map(([k,n])=>`<button class="chip ${state.personalFilter===k?'active':''}" data-action="personal-filter" data-id="${k}">${n}</button>`).join('')}</div></div></section><div class="section-head"><div><h2>${state.personalFilter==='favorite'?'你关注的地点':'此刻，值得看看'}</h2><p>以下地点状态与趋势均为演示样例</p></div><span class="subtle" style="">${pois.length} 个地点</span></div><div class="place-grid">${pois.map(p=>`<article class="box place-card">${scene(p.category==='停车场'?'parking':p.category==='景点'?'park':'personal')}<div class="place-body"><div class="place-top"><h3>${esc(p.name)}</h3><button class="favorite ${p.favorite?'active':''}" data-action="favorite" data-id="${p.id}" aria-label="${p.favorite?'取消关注':'关注'}${esc(p.name)}" aria-pressed="${p.favorite}">${icon('star')}</button></div><p>${esc(p.category)} · ${esc(p.district)}</p><div class="place-foot">${badge(p.category==='停车场'?(p.capacity>0?`可用 ${p.capacity-p.occupied} 车位`:'停车数据待更新'):p.level)}${btn('了解近况 '+icon('arrow'),'place-detail',p.id,'small ghost')}</div></div></article>`).join('')||'<div class="box empty">没有找到地点，试试其他分类或关键词。</div>'}</div><section class="box ask-panel"><div class="eyebrow">ASK SEE TIME</div><h2>想去哪里，先问问近况</h2><p class="muted" style="margin-top:6px">可以试试“哪里适合散步”或“停车方便吗”。</p><form class="ask-form" data-form="ask"><input name="question" placeholder="输入你关心的地点或问题" aria-label="问问 SeeTime" required><button class="button primary" type="submit">问问 SeeTime ${icon('arrow')}</button></form>${state.answer?`<div class="ask-answer"><span class="status neutral">演示回答 · 根据当前示例 POI 整理</span><p style="margin-top:10px">${esc(state.answer)}</p></div>`:''}</section>`}
function accessibleEvents(){return city().events.filter(ev=>store.session.role!=='gridWorker'||ev.assigned)}
function governancePage(){const all=accessibleEvents(),events=all.filter(ev=>(state.filter==='all'||ev.state===state.filter)&&(!state.search||`${ev.id}${ev.type}${ev.location}`.includes(state.search)));const ev=events.find(e=>e.id===state.selected)||events[0];return header('城市治理工作台',`${info().name} · 查看事件态势，核查证据并记录跟进。`,store.session.role==='gridWorker'?'<span class="status neutral">仅查看已分配事件</span>':'<span class="status neutral">目标应用方案 · 示例事件</span>')+`<div class="metrics">${metric('城市今日事件',number(info().eventTotal),'城市级示例统计','chart')}${metric('待确认',all.filter(e=>e.state==='待确认').length,'当前工作清单','bell','amber')}${metric('跟进中',all.filter(e=>e.state==='跟进中').length,'当前工作清单','clock','cyan')}${metric('已归档',all.filter(e=>e.state==='已归档').length,'当前工作清单','check','green')}</div><div class="toolbar" style="padding:0 0 20px;border:0">${chips([['all','全部事件'],['待确认','待确认'],['跟进中','跟进中'],['已归档','已归档']])}${searchForm('搜索事件或发生位置')}</div><div class="event-layout"><div class="event-list">${events.map(e=>`<button class="event-card ${ev?.id===e.id?'active':''}" data-action="select-event" data-id="${e.id}"><div class="event-head"><h3>${esc(e.type)}</h3>${badge(e.state)}</div><p>${esc(e.location)}</p><small>${esc(e.id)} · ${esc(e.time)} · ${esc(e.district)}</small></button>`).join('')||'<div class="box empty">当前筛选下没有事件</div>'}</div>${ev?`<section class="box event-detail">${scene()}<div class="detail-content"><div class="section-head" style="margin:0 0 13px"><div><div class="eyebrow">EVENT DETAIL / 示例</div><h2>${esc(ev.type)} · ${esc(ev.location)}</h2></div>${badge(ev.state)}</div>${detailsGrid([['事件编号',ev.id],['发现时间',ev.time],['来源相机',ev.cameraId],['责任范围',ev.district]])}<div class="detail-actions">${ev.state==='待确认'&&store.session.role!=='gridWorker'?btn(icon('check')+' 确认并关注','confirm-event',ev.id,'primary'):''}${ev.state!=='已归档'?btn(icon('edit')+' 记录进展','record-event',ev.id):''}${ev.state==='跟进中'&&store.session.role!=='gridWorker'?btn('完成跟进','finish-event',ev.id,'ghost'):''}${ev.state==='已归档'?'<span class="muted" style="">此事件已归档，可查看跟进记录。</span>':''}</div><div class="section-head"><h3>跟进记录</h3><small class="subtle">操作仅影响本地演示</small></div><div class="timeline">${ev.notes.slice().reverse().map(n=>`<div class="timeline-item">${esc(n.text)}<small>${esc(n.time)} · 演示记录</small></div>`).join('')}</div></div></section>`:'<div class="box empty">请选择事件查看详情</div>'}</div>`}
function services(){const c=city();return [{route:'access',name:'城市接入服务',shortName:'城市接入',state:'运行中',freshness:'—',latency:82,heartbeat:c.checkTime},{route:'cameras',name:'相机治理服务',shortName:'相机治理',state:'运行中',freshness:'—',latency:96,heartbeat:c.checkTime},{route:'personalProfile',name:'POI 与场景运营服务',shortName:'POI 场景',state:'运行中',freshness:'画像已更新',latency:132,heartbeat:c.checkTime},{route:'personalAnalysis',name:'个人版相机治理服务',shortName:'个人相机',state:'运行中',freshness:c.jobs.some(j=>j.state==='待检查')?'待检查':'更新正常',latency:218,heartbeat:c.checkTime},{route:'govData',name:'治理版事件生产服务',shortName:'事件生产',state:'运行中',freshness:'更新正常',latency:127,heartbeat:c.checkTime},{route:'personal',name:'个人版应用服务',shortName:'个人版',state:'运行中',freshness:'—',latency:69,heartbeat:c.checkTime},{route:'governance',name:'治理版应用服务',shortName:'治理版',state:'运行中',freshness:'—',latency:88,heartbeat:c.checkTime}]}
function operationsPage(){const all=services(),ss=all.filter(s=>can(s.route)),alerts=city().alerts.filter(a=>can(a.route)),delay=ss.filter(s=>s.freshness==='待检查').length,cameraRate=can('cameras')?(info().online/info().total*100).toFixed(1)+'%':'—';return header('平台运行监控','查看已授权产品的服务可用性、数据新鲜度与运行提醒。',btn(icon('refresh')+' 刷新示例快照','refresh-ops','','primary'))+`<div class="metrics">${metric('服务可用',`${ss.filter(s=>s.state==='运行中').length} <small>/ ${ss.length}</small>`,'服务在线与数据新鲜度分别观察','pulse','green')}${metric('相机在线率',cameraRate,can('cameras')?`${number(info().online)} / ${number(info().total)} 路`:'当前身份无相机权限','camera')}${metric('数据待检查',delay,'仅统计当前可见模块','data','amber')}${metric('待确认提醒',alerts.filter(a=>a.state==='未确认').length,`快照更新 ${city().checkTime}`,'bell')}</div><div class="ops-grid"><section class="box"><div class="box-title"><div><h2>服务运行状态</h2><p>指标为监控结构示例；响应时间单位 ms。</p></div><span class="status">${ss.every(s=>s.state==='运行中')?'无服务中断':'存在服务异常'}</span></div>${table(['服务模块','服务状态','数据新鲜度','响应时间','最近心跳',''],ss.map(s=>[`<div class="service-status-row">${icon(MODULES[s.route].icon)}<strong>${s.name}</strong></div>`,badge(s.state),s.freshness==='—'?'<span class="subtle">—</span>':badge(s.freshness),`<span class="mono">${s.latency} ms</span>`,esc(s.heartbeat),btn('详情','service-detail',s.route,'small ghost')]))}</section><section class="box"><div class="box-title"><h2>运行提醒</h2><span class="muted" style="">已授权模块 · ${alerts.length} 项</span></div>${alerts.map(a=>`<div class="alert-line"><span class="alert-mark">!</span><div><b>${a.name}</b><small>${a.desc}</small><div style="margin-top:8px">${badge(a.state)}</div><div style="margin-top:9px;display:flex;gap:8px">${btn('查看','alert-open',a.id,'small ghost')}${a.state==='未确认'?btn('标记已知晓','ack-alert',a.id,'small'):''}</div></div></div>`).join('')||'<div class="empty">当前授权范围内没有运行提醒。</div>'}</section></div>`}
function render(){const pages={workspace:workspacePage,access:accessPage,cameras:camerasPage,personalProfile:personalProfilePage,personalAnalysis:personalAnalysisPage,govData:govDataPage,personal:personalPage,governance:governancePage,operations:operationsPage};const navScroll=document.getElementById('product-navigation')?.scrollTop||0;state.denied=!can(state.route);let content;if(state.denied)content=noPermission();else{const page=(pages[state.route]||workspacePage)();content=state.route==='workspace'?page:moduleWorkspace(page)}document.getElementById('app').innerHTML=shell(content);const nav=document.getElementById('product-navigation');if(nav)nav.scrollTop=navScroll;document.title=`${MODULES[state.route]?.name||'SeeTime'} · SeeTime`;}
function navigate(route,tab=''){if(!MODULES[route])return;state.route=route;state.tab=tab;if(route==='cameras')state.cameraPage=1;state.moduleSection='';state.moduleView='';state.filter='all';state.search='';state.selected='';state.answer='';closeOverlay();render();const location=can(route)?moduleLocation():null,moduleButton=document.getElementById('module-nav-'+route);moduleButton?.scrollIntoView?.({block:'nearest'});if(location)document.getElementById('module-section-'+route+'-'+location.section.id)?.scrollIntoView?.({block:'nearest'});moduleButton?.focus?.({preventScroll:true});window.scrollTo?.({top:0,behavior:'instant'})}
function signIn(id){if(!ROLES[id])return;store.session.role=id;if(!role().cities.includes(store.session.city))store.session.city=role().cities[0];persistSession();navigate(role().home);notify(`已进入 ${role().name} · ${info().name}`)}
function switchCity(id){if(!role().cities.includes(id)){notify('当前身份未授权此城市');return false}store.session.city=id;persistSession();window.SeeTimeOps?.afterCitySwitch(id);state.filter='all';state.search='';state.selected='';state.answer='';closeOverlay();render();notify(`已切换到 ${info().name}，示例记录同步更新`);return true}
function closeOverlay(){document.getElementById('overlay').innerHTML='';activeOverlay=null;document.body.style.overflow=''}
function showDrawer(title,subtitle,body,footer=''){activeOverlay={kind:'drawer'};document.getElementById('overlay').innerHTML=`<div class="drawer-overlay" data-backdrop="true"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="drawer-head"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="close-button" data-action="close" aria-label="关闭">${icon('close')}</button></header><div class="drawer-body">${body}</div><footer class="drawer-footer"><small>本地交互演示</small>${footer||btn('关闭','close')}</footer></section></div>`;document.body.style.overflow='hidden';document.getElementById('overlay').querySelector('button')?.focus()}
function showAccount(){activeOverlay={kind:'account'};document.getElementById('overlay').innerHTML=`<div class="modal-wrap" data-backdrop="true"><section class="modal" role="dialog" aria-modal="true" aria-label="切换演示身份"><header class="modal-head"><div><div class="eyebrow">SEETIME IDENTITY</div><h2>以不同身份进入 SeeTime</h2><p>模块、城市范围和操作权限会随身份切换。</p></div><button class="close-button" data-action="close" aria-label="关闭">${icon('close')}</button></header><div class="modal-body"><div class="persona-grid">${Object.entries(ROLES).map(([id,r])=>`<button class="persona ${store.session.role===id?'active':''}" data-action="sign-in" data-id="${id}">${icon(id==='personalUser'?'poi':id==='admin'?'layers':'user')}<span><strong>${r.name}</strong><small>${r.desc}</small><small>${r.cities.map(c=>CITY_INFO[c].name).join(' / ')}</small></span></button>`).join('')}</div><p class="local-note">这是身份授权的交互演示，不输入真实账号或密码。</p></div></section></div>`;document.body.style.overflow='hidden'}

function requireText(value,label,max=200){const v=String(value??'').trim();if(!v)throw new Error(`请填写${label}。`);if(v.length>max)throw new Error(`${label}不能超过 ${max} 字。`);return v}
function requireNumber(value,label,min,max){if(value==null||String(value).trim()==='')throw new Error(`请填写${label}。`);const v=Number(value);if(!Number.isFinite(v)||!Number.isInteger(v)||v<min||v>max)throw new Error(`${label}须为 ${min}–${max} 之间的整数。`);return v}
function nextId(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function saveRecord(kind,v,id=''){if(!FORM_ROUTES[kind]||!can(FORM_ROUTES[kind]))throw new Error('当前身份无权保存此模块的数据。');const c=city();let resultId=id;
if(kind==='source'){const source={id:nextId('s'),name:requireText(v.name,'来源名称',50),type:v.type,count:requireNumber(v.count,'相机数量',1,1000000),expires:requireText(v.expires,'授权有效期',20),status:'本地草稿'};if(!['平台接入','资源订阅','项目接入'].includes(source.type))throw new Error('接入类型无效。');c.sources.push(source);resultId=source.id;}
else if(kind==='camera'){const item=c.cameras.find(x=>x.id===id);if(!item)throw new Error('相机不存在。');const name=requireText(v.name,'相机名称',60);if(!info().districts.includes(v.district))throw new Error('区域不在当前城市。');Object.assign(item,{name,district:v.district,note:String(v.note||'').trim().slice(0,200)});}
else if(kind==='poi'){const name=requireText(v.name,'POI 名称',50),description=requireText(v.description,'地点介绍',200);if(!['商圈','景点','停车场'].includes(v.category)||!info().districts.includes(v.district)||!c.cameras.some(x=>x.id===v.cameraId))throw new Error('请选择当前城市内的分类、区域和相机。');let item=id?c.pois.find(x=>x.id===id):null;if(id&&!item)throw new Error('POI 不存在。');if(!item){item={id:nextId('p'),cameraCount:1,favorite:false,capacity:100,occupied:60,interval:5,level:'状态待更新'};c.pois.push(item);}Object.assign(item,{name,category:v.category,district:v.district,cameraId:v.cameraId,description,completeness:100,updated:now()});resultId=item.id;}
else if(kind==='parking'){const item=c.pois.find(x=>x.id===id&&x.category==='停车场');if(!item)throw new Error('停车场不存在。');const capacity=requireNumber(v.capacity,'总泊位',1,100000),occupied=requireNumber(v.occupied,'占用泊位',0,100000),interval=requireNumber(v.interval,'检测间隔',1,60);if(occupied>capacity)throw new Error('占用泊位不能超过总泊位。');Object.assign(item,{capacity,occupied,interval,updated:now()});}
else if(kind==='job'){const job={id:nextId('j'),name:requireText(v.name,'任务名称',50),poiId:v.poiId,type:v.type,frequency:v.frequency,state:'本地草稿',updated:'—',result:''};if(!c.pois.some(p=>p.id===job.poiId)||!['图片理解','时序检测','综合分析'].includes(job.type)||!['每 5 分钟','每 15 分钟','每 1 小时','按需运行'].includes(job.frequency))throw new Error('任务参数无效。');c.jobs.push(job);resultId=job.id;}
else if(kind==='rule'){const name=requireText(v.name,'规则名称',50),duration=requireNumber(v.duration,'持续时间',1,60),threshold=requireNumber(v.threshold,'置信阈值',1,100);if(!['道路积水','占道经营','设施异常'].includes(v.type))throw new Error('检测类型无效。');if(id&&c.configs.some(cfg=>cfg.ruleId===id&&cfg.type!==v.type))throw new Error('此规则已被检测配置引用，不能修改检测类型。请新建独立规则。');if(id&&v.enabled!=='true'&&c.configs.some(cfg=>cfg.ruleId===id&&cfg.enabled))throw new Error('此规则正在被启用配置使用，请先停用关联检测配置。');let item=id?c.rules.find(x=>x.id===id):null;if(id&&!item)throw new Error('规则不存在。');if(!item){item={id:nextId('rule')};c.rules.push(item);}Object.assign(item,{name,type:v.type,duration,threshold,enabled:v.enabled==='true'});resultId=item.id;}
else if(kind==='region'){const item=c.regions.find(x=>x.id===id);if(!item)throw new Error('区域不存在。');const name=requireText(v.name,'区域名称',50),x=requireNumber(v.x,'左边界',0,95),y=requireNumber(v.y,'上边界',0,95),w=requireNumber(v.w,'宽度',5,100),h=requireNumber(v.h,'高度',5,100);if(x+w>100||y+h>100)throw new Error('检测区域不能超出画面：左边界 + 宽度、上边界 + 高度均须小于等于 100%。');if(!c.cameras.some(cam=>cam.id===v.cameraId))throw new Error('来源相机无效。');if(c.configs.some(cfg=>cfg.regionId===id&&cfg.cameraId!==v.cameraId))throw new Error('该区域已被检测配置引用，不能改挂其他相机。请保持原相机或新建独立区域。');Object.assign(item,{name,cameraId:v.cameraId,x,y,w,h});}

tab" aria-selected="${d.tab==='observation'}" data-dynamic-tab="observation">当前观测</button><button class="dynamic-tab" type="button" role="tab" aria-selected="${d.tab==='periodic'}" data-dynamic-tab="periodic">周期分析</button></div>`;let panel='';if(d.tab==='periodic'){const p=dynamicPeriodData(d.period);panel=`<div class="dynamic-period-controls"><span>统计区间</span>${[['2h','近 2 小时'],['24h','近 24 小时'],['7d','近 7 天']].map(([id,label])=>`<button class="dynamic-period ${d.period===id?'active':''}" type="button" data-dynamic-period="${id}" aria-pressed="${d.period===id}">${label}</button>`).join('')}</div><section class="box"><div class="box-title"><div><h2>周期概览</h2><p>${p.label} · 生成于 10:40</p></div>${p.adequate?'<span class="status neutral">样本可用</span>':'<span class="status warn">样本不足</span>'}</div><div class="detail-content"><div class="dynamic-coverage">${metric('有效观测',`${p.count} / ${p.expected}`,'已接收样本 / 计划采样','data')}${metric('时间覆盖率',`${p.coverage}%`,'按采样时段估算','chart')}${metric('统计区间',p.label,'按观测时间统计','calendar')}</div>${p.adequate?`<div class="dynamic-quality-note">${esc(p.summary)} 结论仅概括已取得的有效观测，不外推未覆盖时段。</div>${dynamicTrend()}<h3>观测摘要</h3><div class="dynamic-observations"><article class="dynamic-observation"><div><strong>${m.parking?'车辆通行':'车流'}</strong><span class="status neutral">已观测到</span></div><p>${m.parking?'高峰观测约 31 辆 / 5 分钟，低峰约 12 辆 / 5 分钟。':'多数有效观测显示车流处于平稳至中等水平。'}</p></article><article class="dynamic-observation"><div><strong>数据限制</strong><span class="status neutral">离散快照</span></div><p>样本间隔内的变化无法由本页数据确认；仅比较画面质量和视角一致的观测。</p></article></div>`:`<div class="dynamic-quality-note">${esc(p.summary)} 当前仅取得 ${p.count} 条有效样本，覆盖率 ${p.coverage}%；保留样本记录，不展示趋势推断。</div>`}</div></section><section class="box" style="margin-top:16px"><div class="box-title"><div><h2>代表性观测</h2><p>按观测时间展示的样例快照</p></div></div><div class="detail-content"><div class="dynamic-event-list"><div class="dynamic-event"><time>10:35</time><span>画面质量：${esc(m.quality)} · 场景：${esc(m.description)}</span></div><div class="dynamic-event"><time>09:50</time><span>有效观测样例 · 与当前画面视角可比较</span></div></div></div></section>`}else{panel=`<div class="dynamic-layout"><section class="box"><div class="box-title"><div><h2>观测画面</h2><p>观测时间 2026-10-23 10:35 · 分析完成 10:36</p></div><span class="status neutral">单次快照</span></div><div class="dynamic-frame">${sceneImage(cameraFrameKind(selected))}<span class="dynamic-frame-label">示意画面 · 非现场实时视频</span></div><div class="detail-content"><h3>画面描述</h3><p>${esc(m.description)}</p></div></section><section class="box"><div class="box-title"><div><h2>本次检测结果</h2><p>仅反映该时刻画面证据</p></div></div><div class="detail-content"><div class="dynamic-stats">${[['画面质量',m.quality],['相机状态',selected.state],['观测时间','10:35'],['POI',m.poi?.name||'—']].map(([k,v])=>`<div class="dynamic-stat"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="dynamic-observations">${m.observations.map(([name,status,value])=>`<article class="dynamic-observation"><div><strong>${name}</strong><span class="status ${status==='uncertain'?'warn':'neutral'}">${dynamicStatus(status)}</span></div><p>${value}</p></article>`).join('')}</div></div></section></div><section class="box" style="margin-top:16px"><div class="box-title"><div><h2>观测质量与范围</h2><p>阅读本次结果时请同时查看限制</p></div></div><div class="detail-content"><div class="dynamic-quality-note">${esc(m.quality)}。结果基于单帧示例画面；遮挡、视角变化、夜间或低清画面可能降低识别可信度。未知、不确定与本次未观测到不会合并解释。</div></div></section>`}return dynamicHeader()+`<div class="dynamic-analysis">${list}<main class="dynamic-detail">${common}${panel}</main></div>`}
function renderDynamicAnalysis(){destroyCameraMap();const content=!can('personalDynamicAnalysis')||!can('projects')?noPermission():!currentProject()?`<div class="box empty"><h2>先选择一个项目</h2><p>在项目池中选择授权项目后继续。</p>${routeButton('进入项目池','projects','primary')}</div>`:dynamicAnalysisPage();document.getElementById('app').innerHTML=shell(content);document.title=`${MODULES[state.route].name} · SeeTime`}
const renderBeforeDynamicAnalysis=render;
render=function(){if(state.route==='personalDynamicAnalysis'){renderDynamicAnalysis();return}renderBeforeDynamicAnalysis()};
document.addEventListener('click',event=>{const t=event.target.closest?.('[data-dynamic-camera],[data-dynamic-tab],[data-dynamic-period]');if(!t)return;const d=state.dynamicAnalysis;if(t.dataset.dynamicCamera){d.cameraId=t.dataset.dynamicCamera;d.tab='observation'}if(t.dataset.dynamicTab)d.tab=t.dataset.dynamicTab;if(t.dataset.dynamicPeriod)d.period=t.dataset.dynamicPeriod;render()});
document.addEventListener('change',event=>{if(event.target.dataset.dynamicFilter==='district'){state.dynamicAnalysis.district=event.target.value;state.dynamicAnalysis.cameraId='';render()}});
document.addEventListener('submit',event=>{const form=event.target;if(!form.matches('[data-dynamic-search]'))return;event.preventDefault();state.dynamicAnalysis.search=String(new FormData(form).get('q')||'').trim();state.dynamicAnalysis.cameraId='';render()});
render();
</script>

<style>

<script>
function dynamicMetrics(cam){const poi=cameraPoi(cam),parking=poi?.category==='停车场',quality=cam.quality==='清晰'?'清晰':'需复核';return {poi,parking,quality,description:parking?'画面覆盖停车场入口及部分停车区域，可见车辆进出。':'画面覆盖城市道路与公共空间，可见车辆及步行区域。',observedAt:'2026-10-23 10:35:00 +08:00',analyzedAt:'2026-10-23 10:36:12 +08:00',observationId:`OBS-${cam.id}-20261023-103500`,imageId:`IMG-${cam.id}-20261023-103500`,coverage:parking?'停车场入口及部分车位（局部视野）':'道路及相邻步行区域（局部视野）',capabilities:parking?['车辆','可见车位','排队']:['车流','人流','排队'],limitations:parking?'仅统计画面中可辨识车位；未确认覆盖全部车位，不推断停车场剩余车位。':'画面边缘存在遮挡；单张图片不能推断连续车速或未覆盖区域状态。',retrievalTags:parking?['停车场','车辆出入','可见车位']:['城市道路','车流','步行区域'],observations:parking?[['车辆通行','observed','画面内可见车辆进出；本条为单帧观察，不代表连续流量。'],['可见车位','observed','画面中可辨识 18 个车位，其中 12 个有车辆；仅限可见范围。'],['排队情况','uncertain','入口局部遮挡，当前画面无法稳定判断。']]:[['车流','observed','画面内可见车辆；不等同于路段拥堵指数或车速。'],['人流','uncertain','画面边缘有遮挡，无法稳定判断整体人流状态。'],['排队','not_observed','本次可见范围内未观察到明显排队；不代表其他区域没有。']]}}
function dynamicPeriodData(cam,period){const parking=cameraPoi(cam)?.category==='停车场';return ({'2h':{label:'近 2 小时',count:18,expected:24,coverage:75,adequate:true,summary:parking?'该相机有效观测中，停车区域可见车辆状态有变化；样本仅代表该相机覆盖范围。':'该相机有效观测中，画面内车流状态整体相近；样本仅代表该相机覆盖范围。'},'24h':{label:'近 24 小时',count:42,expected:48,coverage:88,adequate:true,summary:parking?'该相机有效观测覆盖多个时段；可见车位占用情况仅在有效画面中统计。':'该相机有效观测覆盖多个时段；画面内车辆状态整体相近。'},'7d':{label:'近 7 天',count:9,expected:336,coverage:3,adequate:false,summary:'样本覆盖不足，暂不生成该相机的周期趋势结论。'}})[period]}
function dynamicTrend(cam,period){const points=period==='7d'?[92,88,100,82,106,96,111,90,108,97,115,105]:cameraPoi(cam)?.category==='停车场'?[102,89,96,78,91,68,81,62,77,58,72,52]:[110,100,108,82,90,70,78,61,74,53,66,47],coords=points.map((y,i)=>`${i*80},${y}`).join(' ');return `<div class="dynamic-trend"><svg viewBox="0 0 880 160" role="img" aria-label="单路相机离散观测示意趋势"><path d="M0 20H880M0 60H880M0 100H880M0 140H880" stroke="#294159"/><polyline points="${coords}" fill="none" stroke="#5bd5ef" stroke-width="3"/>${points.map((y,i)=>`<circle cx="${i*80}" cy="${y}" r="4" fill="#5bd5ef"/>`).join('')}<text x="0" y="155">${period==='7d'?'第 1 天':'00:00'}</text><text x="400" y="155">${period==='7d'?'第 4 天':'12:00'}</text><text x="835" y="155">${period==='7d'?'第 7 天':'24:00'}</text></svg><p class="local-note">示例数据：每个点代表该相机的一次离散观测；连线仅辅助阅读，不代表连续监测。</p></div>`}
function dynamicAnalysisPage(){const d=state.dynamicAnalysis,cameras=dynamicCameras().filter(c=>(!d.search||`${c.name} ${c.id} ${cameraPoi(c)?.name||''}`.toLowerCase().includes(d.search.toLowerCase()))&&(d.district==='all'||c.district===d.district));if(!cameras.some(c=>c.id===d.cameraId))d.cameraId=cameras[0]?.id||'';const selected=cameras.find(c=>c.id===d.cameraId);const list=`<section class="box dynamic-camera-list"><form class="dynamic-search" data-dynamic-search><input name="q" value="${esc(d.search)}" placeholder="搜索相机或已挂载 POI" aria-label="搜索相机或已挂载 POI"><button class="button small ghost" type="submit">搜索</button></form><div style="padding:0 14px 12px"><label class="context-select"><span>区县</span><select data-dynamic-filter="district" aria-label="按区县筛选"><option value="all">全部区县</option>${info().districts.map(x=>`<option value="${esc(x)}" ${d.district===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><div class="dynamic-list-meta">${cameras.length} 路个人版已挂载相机 · 示例观测数据</div><div class="dynamic-scope-note" style="margin:0 14px 12px">分析对象始终是当前选中的单路相机。POI 仅用于标注归属和查找，不合并同一 POI 下多路相机的数据。</div><div class="dynamic-camera-items">${cameras.map(c=>`<button type="button" class="dynamic-camera-item ${c.id===d.cameraId?'active':''}" data-dynamic-camera="${esc(c.id)}" aria-pressed="${c.id===d.cameraId}"><div class="camera-list-thumb">${sceneImage(cameraFrameKind(c))}</div><div><strong>${esc(c.name)}</strong><small>${esc(c.id)} · 挂载 POI：${esc(cameraPoi(c)?.name||'—')}</small><small>示例观测 · 10:35</small></div></button>`).join('')||'<div class="empty">当前项目没有符合条件的个人版已挂载相机。</div>'}</div></section>`;if(!selected)return dynamicHeader()+list;const m=dynamicMetrics(selected),common=`<div class="dynamic-detail-head"><div><h1>${esc(selected.name)}</h1><p>${esc(selected.id)} · ${esc(currentProject().name)} · 挂载 POI：${esc(m.poi?.name||'—')}</p></div><div class="dynamic-head-meta"><span class="status neutral">演示数据</span></div></div><div class="dynamic-tabs" role="tablist" aria-label="动态分析内容"><button class="dynamic-tab" type="button" role="tab" aria-selected="${d.tab==='observation'}" data-dynamic-tab="observation">当前观测</button><button class="dynamic-tab" type="button" role="tab" aria-selected="${d.tab==='periodic'}" data-dynamic-tab="periodic">周期分析</button><button class="dynamic-tab" type="button" role="tab" aria-selected="${d.tab==='trace'}" data-dynamic-tab="trace">C 端问答回溯</button></div>`;let panel='';if(d.tab==='periodic'){const p=dynamicPeriodData(selected,d.period);panel=`<div class="dynamic-scope-note">统计范围：${esc(selected.name)}（${esc(selected.id)}）单路相机。即使同一 POI 下有多路相机，也分别统计，不生成 POI 汇总结论。</div><div class="dynamic-period-controls"><span>统计区间</span>${[['2h','近 2 小时'],['24h','近 24 小时'],['7d','近 7 天']].map(([id,label])=>`<button class="dynamic-period ${d.period===id?'active':''}" type="button" data-dynamic-period="${id}" aria-pressed="${d.period===id}">${label}</button>`).join('')}</div><section class="box"><div class="box-title"><div><h2>周期分析</h2><p>${p.label} · 单路相机 · 示例统计</p></div>${p.adequate?'<span class="status neutral">样本可用</span>':'<span class="status warn">样本不足</span>'}</div><div class="detail-content"><div class="dynamic-coverage">${metric('有效观测',`${p.count} / ${p.expected}`,'已接收样本 / 计划采样','data')}${metric('时间覆盖率',`${p.coverage}%`,'按采样时段估算','chart')}${metric('分析对象',selected.id,selected.name,'camera')}</div>${p.adequate?`<div class="dynamic-quality-note">${esc(p.summary)} 本结论只概括该相机已取得的有效观测，不外推未覆盖时段。</div>${dynamicTrend(selected,d.period)}<h3>周期观察摘要</h3><div class="dynamic-observations"><article class="dynamic-observation"><div><strong>${m.parking?'可见车位与车辆':'画面内车流'}</strong><span class="status neutral">样本归纳</span></div><p>${esc(p.summary)}</p></article><article class="dynamic-observation"><div><strong>数据限制</strong><span class="status neutral">离散快照</span></div><p>${esc(m.limitations)} 样本间隔内的变化无法由本页数据确认。</p></article></div>`:`<div class="dynamic-quality-note">${esc(p.summary)} 当前仅取得 ${p.count} 条有效样本，覆盖率 ${p.coverage}%；保留观测记录，不展示趋势推断。</div>`}</div></section><section class="box" style="margin-top:16px"><div class="box-title"><div><h2>代表性观测</h2><p>本相机时间窗内的示例快照记录</p></div></div><div class="detail-content"><div class="dynamic-event-list"><div class="dynamic-event"><time>10:35</time><span>画面质量：${esc(m.quality)} · ${esc(m.description)}</span></div><div class="dynamic-event"><time>09:50</time><span>示例历史观测 · 可比较性以画面质量、视角和覆盖范围一致为前提</span></div></div></div></section>`}else if(d.tab==='trace'){const parking=m.parking;panel=`<div class="dynamic-scope-note">此处用于定位 C 端答复使用了哪路相机、哪条观测及哪些限制。当前为交互原型示例，尚未接入真实 C 端问答日志；不代表实际用户提问或线上答复。</div><section class="box"><div class="box-title"><div><h2>问答证据链示例</h2><p>所有来源均限定为当前相机，不跨相机或 POI 汇总</p></div><span class="status neutral">演示数据</span></div><div class="detail-content"><div class="dynamic-trace-grid"><article class="dynamic-trace-card"><h3>场景：答案需要谨慎表达</h3><div class="dynamic-trace-line"><span>C 端问题</span><span>${parking?'这个停车场还剩多少车位？':'这里现在人多吗？'}</span></div><div class="dynamic-trace-line"><span>参考答复</span><span>${parking?'当前画面可见 18 个车位，其中 12 个有车辆；由于视野未覆盖全部区域，无法据此确认停车场剩余车位。':'当前画面边缘存在遮挡，暂时无法可靠判断整体人流。'}</span></div><div class="dynamic-trace-line"><span>引用观测</span><span>${esc(m.observationId)} · ${m.observedAt}</span></div><div class="dynamic-trace-line"><span>使用字段</span><span>${parking?'可见车位：18；有车辆：12；状态：已观测到':'人流状态：不确定；画面质量：'+m.quality}</span></div><div class="dynamic-trace-evidence">限制条件：${esc(m.limitations)}</div></article><article class="dynamic-trace-card"><h3>排查：C 端无数据时</h3><div class="dynamic-trace-line"><span>检查顺序</span><span>相机是否有可用图片 → 本次分析是否成功 → 该检测能力是否已配置 → 观测状态是否为“不确定 / 不支持”</span></div><div class="dynamic-trace-line"><span>本次状态</span><span>图片分析成功 · ${m.capabilities.join('、')} · ${m.observations.map(x=>`${x[0]}：${dynamicStatus(x[1])}`).join('；')}</span></div><div class="dynamic-trace-line"><span>证据图片</span><span>${esc(m.imageId)} · ${m.observedAt}</span></div><div class="dynamic-trace-evidence">若 C 端答复与画面不符，可用观测时间和图片标识定位原始快照，并核对模型结果与答复引用字段。</div></article></div></div></section><section class="box" style="margin-top:16px"><div class="box-title"><div><h2>当前相机可追溯信息</h2><p>用于将观测结果与 C 端使用的数据来源对应起来</p></div></div><div class="detail-content"><div class="dynamic-stats">${[['相机编号',selected.id],['挂载 POI',m.poi?.name||'—'],['观测记录',m.observationId],['图片记录',m.imageId],['观测时间',m.observedAt],['分析完成',m.analyzedAt],['分析状态','成功（示例）'],['覆盖范围',m.coverage]].map(([k,v])=>`<div class="dynamic-stat"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div></div></section>`}else{panel=`<div class="dynamic-scope-note">单次观测说明一个时间点、一个相机覆盖范围内看到了什么；状态“未观察到 / 不确定 / 不支持”含义不同，不能合并解释。</div><div class="dynamic-layout"><section class="box"><div class="box-title"><div><h2>观测画面</h2><p>拍摄 ${m.observedAt} · 分析完成 ${m.analyzedAt}</p></div><span class="status neutral">单次快照 · 演示数据</span></div><div class="dynamic-frame">${sceneImage(cameraFrameKind(selected))}<span class="dynamic-frame-label">示意画面 · 非现场实时视频</span></div><div class="detail-content"><h3>画面描述</h3><p>${esc(m.description)}</p></div></section><section class="box"><div class="box-title"><div><h2>本次观测结果</h2><p>只表示该相机画面中的可见信息</p></div></div><div class="detail-content"><div class="dynamic-stats">${[['画面质量',m.quality],['观测时间',m.observedAt],['相机覆盖范围',m.coverage],['已配置检测能力',m.capabilities.join('、')]].map(([k,v])=>`<div class="dynamic-stat"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="dynamic-observations">${m.observations.map(([name,status,value])=>`<article class="dynamic-observation"><div><strong>${esc(name)}</strong><span class="status ${status==='uncertain'?'warn':'neutral'}">${dynamicStatus(status)}</span></div><p>${esc(value)}</p></article>`).join('')}</div><h3>检索标签</h3><div class="tag-list">${m.retrievalTags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div></div></section></div><section class="box" style="margin-top:16px"><div class="box-title"><div><h2>观测证据与限制</h2><p>帮助核对 C 端答复是否超出图片所能支持的范围</p></div></div><div class="detail-content"><div class="dynamic-stats">${[['观测记录 ID',m.observationId],['图片记录 ID',m.imageId],['相机',`${selected.name}（${selected.id}）`],['挂载 POI',m.poi?.name||'—']].map(([k,v])=>`<div class="dynamic-stat"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="dynamic-quality-note">${esc(m.limitations)} “未观察到”仅指本次可见范围；“不确定”表示证据不足；“不支持”表示当前相机或分析配置不具备该项能力。</div></div></section>`}return dynamicHeader()+`<div class="dynamic-analysis">${list}<main class="dynamic-detail">${common}${panel}</main></div>`}
document.addEventListener('click',event=>{const t=event.target.closest?.('[data-dynamic-camera-toggle],[data-dynamic-camera],[data-dynamic-tab],[data-dynamic-period]');if(!t)return;event.stopImmediatePropagation();event.preventDefault();const d=state.dynamicAnalysis;if(t.dataset.dynamicCameraToggle){const id=t.dataset.dynamicCameraToggle,expanded=d.expandedCameraPoiIds||[],index=expanded.indexOf(id);if(index>=0)expanded.splice(index,1);else expanded.push(id);d.expandedCameraPoiIds=expanded}if(t.dataset.dynamicCamera){d.cameraId=t.dataset.dynamicCamera;d.tab='observation'}if(t.dataset.dynamicTab)d.tab=t.dataset.dynamicTab;if(t.dataset.dynamicPeriod)d.period=t.dataset.dynamicPeriod;render()},true);

<script>
function dynamicHeader(){return `<div class="page-heading"><div><h1>个人版相机动态分析</h1><p>按 POI 查看已挂载相机；单次观测与周期分析均按单路相机展示，不汇总到 POI。</p></div></div>`}
function dynamicPoiSearchText(cam){const pois=city().pois||[],byId=new Map(pois.map(p=>[p.id,p])),names=[],seen=new Set();let poi=cameraPoi(cam);while(poi&&!seen.has(poi.id)){seen.add(poi.id);names.push(poi.name||'');poi=byId.get(poi.parentId)}return names.join(' ')}
function dynamicPoiTreeMarkup(cameras,d){const pois=city().pois||[],byId=new Map(pois.map(p=>[p.id,p])),nodes=new Map(),root=[];const ensureNode=poi=>{if(!poi)return null;if(nodes.has(poi.id))return nodes.get(poi.id);const node={id:poi.id,poi,cameras:[],children:[],order:pois.indexOf(poi)};nodes.set(poi.id,node);const parent=byId.get(poi.parentId);if(parent){const parentNode=ensureNode(parent);if(parentNode)parentNode.children.push(node);else root.push(node)}else root.push(node);return node};for(const cam of cameras){const poi=cameraPoi(cam);if(poi)ensureNode(poi).cameras.push(cam);else{if(!nodes.has('__unassigned__')){const node={id:'__unassigned__',poi:{name:'未关联 POI',category:'未关联',district:''},cameras:[],children:[],order:pois.length};nodes.set(node.id,node);root.push(node)}nodes.get('__unassigned__').cameras.push(cam)}}const renderNode=(node,depth=0)=>{const expanded=(d.expandedCameraPoiIds||[]).includes(node.id),hasCameras=node.cameras.length>0,label=node.poi?.name||'未关联 POI',meta=[node.poi?.category,node.poi?.district].filter(Boolean).join(' · '),heading=hasCameras?`<button class="dynamic-poi-heading ${expanded?'expanded':''}" type="button" data-dynamic-camera-toggle="${esc(node.id)}" aria-expanded="${expanded}" aria-label="${expanded?'收起':'展开'} ${esc(label)} 下的 ${node.cameras.length} 路相机"><span class="dynamic-poi-caret" aria-hidden="true">›</span><span class="dynamic-poi-heading-copy"><strong>${esc(label)}</strong><small>${esc(meta||'POI')}</small></span><span class="dynamic-poi-count">${node.cameras.length} 路相机</span></button>`:`<div class="dynamic-poi-heading dynamic-poi-heading-static"><span class="dynamic-poi-caret dynamic-poi-caret-muted" aria-hidden="true">›</span><span class="dynamic-poi-heading-copy"><strong>${esc(label)}</strong><small>${esc(meta||'POI')}</small></span><span class="dynamic-poi-count">${node.children.length?`${node.children.length} 个下级POI`:''}</span></div>`,cameraList=hasCameras?`<div class="dynamic-camera-items ${expanded?'expanded':''}" ${expanded?'':'hidden'}>${node.cameras.map(c=>`<button type="button" class="dynamic-camera-item ${c.id===d.cameraId?'active':''}" data-dynamic-camera="${esc(c.id)}" aria-pressed="${c.id===d.cameraId}"><div class="camera-list-thumb">${sceneImage(cameraFrameKind(c))}</div><div><strong>${esc(c.name)}</strong><small>${esc(c.id)}${c.id===d.cameraId?' · 当前分析':''}</small><small>最近观测 10:35 · 示例</small></div></button>`).join('')}</div>`:'',children=node.children.length?`<div class="dynamic-poi-children">${node.children.sort((a,b)=>a.order-b.order).map(child=>renderNode(child,depth+1)).join('')}</div>`:'';return `<section class="dynamic-poi-group" style="--poi-depth:${depth}">${heading}${cameraList}${children}</section>`};return root.sort((a,b)=>a.order-b.order).map(node=>renderNode(node)).join('')}
function dynamicAnalysisPage(){const d=state.dynamicAnalysis,query=(d.search||'').toLowerCase(),cameras=dynamicCameras().filter(c=>(!query||`${c.name} ${c.id} ${dynamicPoiSearchText(c)}`.toLowerCase().includes(query))&&(d.district==='all'||c.district===d.district));d.expandedCameraPoiIds=d.expandedCameraPoiIds||[];if(!cameras.some(c=>c.id===d.cameraId))d.cameraId=cameras[0]?.id||'';if(d.tab==='trace')d.tab='observation';const selected=cameras.find(c=>c.id===d.cameraId),poiCount=new Set(cameras.map(c=>cameraPoi(c)?.id||'__unassigned__')).size,list=`<section class="box dynamic-camera-list"><form class="dynamic-search" data-dynamic-search><input name="q" value="${esc(d.search)}" placeholder="搜索 POI 或相机名称 / 编号" aria-label="搜索 POI 或相机名称或编号"><button class="button small ghost" type="submit">搜索</button></form><div style="padding:0 14px 12px"><label class="context-select"><span>区县</span><select data-dynamic-filter="district" aria-label="按区县筛选"><option value="all">全部区县</option>${info().districts.map(x=>`<option value="${esc(x)}" ${d.district===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label></div><div class="dynamic-list-meta">${poiCount} 个 POI · ${cameras.length} 路已挂载相机</div><div class="dynamic-poi-groups">${dynamicPoiTreeMarkup(cameras,d)||'<div class="empty">当前项目没有符合条件的个人版已挂载相机。</div>'}</div></section>`;if(!selected)return dynamicHeader()+list;const m=dynamicMetrics(selected),common=`<div class="dynamic-detail-head"><div><h1>${esc(selected.name)}</h1><p>${esc(selected.id)} · 所属 POI：${esc(m.poi?.name||'—')}</p></div><div class="dynamic-head-meta"><span class="status neutral">单路相机 · 示例数据</span></div></div><div class="dynamic-tabs" role="tablist" aria-label="动态分析内容"><button class="dynamic-tab" type="button" role="tab" aria-selected="${d.tab==='observation'}" data-dynamic-tab="observation">当前观测</button><button class="dynamic-tab" type="button" role="tab" aria-selected="${d.tab==='periodic'}" data-dynamic-tab="periodic">周期分析</button></div>`;let panel='';if(d.tab==='periodic'){const p=dynamicPeriodData(selected,d.period);panel=`<div class="dynamic-period-controls"><span>统计区间</span>${[['2h','近 2 小时'],['24h','近 24 小时'],['7d','近 7 天']].map(([id,label])=>`<button class="dynamic-period ${d.period===id?'active':''}" type="button" data-dynamic-period="${id}" aria-pressed="${d.period===id}">${label}</button>`).join('')}</div><section class="box"><div class="box-title"><div><h2>周期分析</h2><p>${p.label} · 单路相机 · 示例统计</p></div>${p.adequate?'<span class="status neutral">样本可用</span>':'<span class="status warn">样本不足</span>'}</div><div class="detail-content"><div class="dynamic-coverage">${metric('有效观测',`${p.count} / ${p.expected}`,'已接收样本 / 计划采样','data')}${metric('时间覆盖率',`${p.coverage}%`,'按采样时段估算','chart')}</div>${p.adequate?`${dynamicTrend(selected,d.period)}<h3>周期观察摘要</h3><div class="dynamic-observations"><article class="dynamic-observation"><div><strong>${m.parking?'可见车位与车辆':'画面内车流'}</strong><span class="status neutral">样本归纳</span></div><p>${esc(p.summary)}</p></article><article class="dynamic-observation"><div><strong>数据限制</strong><span class="status neutral">离散快照</span></div><p>${esc(m.limitations)} 样本间隔内的变化无法由本页数据确认。</p></article></div>`:`<div class="dynamic-quality-note">${esc(p.summary)} 当前仅取得 ${p.count} 条有效样本，覆盖率 ${p.coverage}%；保留观测记录，不展示趋势推断。</div>`}</div></section><section class="box" style="margin-top:16px"><div class="box-title"><div><h2>代表性观测</h2><p>当前相机时间窗内的示例快照</p></div></div><div class="detail-content"><div class="dynamic-event-list"><div class="dynamic-event"><time>10:35</time><span>画面质量：${esc(m.quality)} · ${esc(m.description)}</span></div><div class="dynamic-event"><time>09:50</time><span>示例历史观测 · 可比较性以画面质量、视角和覆盖范围一致为前提</span></div></div></div></section>`}else{panel=`<div class="dynamic-layout"><section class="box"><div class="box-title"><div><h2>观测画面</h2><p>拍摄 ${m.observedAt} · 分析完成 ${m.analyzedAt}</p></div></div><div class="dynamic-frame">${sceneImage(cameraFrameKind(selected))}<span class="dynamic-frame-label">示意画面 · 非现场实时视频</span></div><div class="detail-content"><h3>画面描述</h3><p>${esc(m.description)}</p></div></section><section class="box"><div class="box-title"><div><h2>观测结果</h2></div></div><div class="detail-content"><div class="dynamic-stats">${[['画面质量',m.quality],['观测时间',m.observedAt],['相机覆盖范围',m.coverage],['已配置检测能力',m.capabilities.join('、')]].map(([k,v])=>`<div class="dynamic-stat"><span>${k}</span><strong>${esc(v)}</strong></div>`).join('')}</div><div class="dynamic-observations">${m.observations.map(([name,status,value])=>`<article class="dynamic-observation"><div><strong>${esc(name)}</strong><span class="status ${status==='uncertain'?'warn':'neutral'}">${dynamicStatus(status)}</span></div><p>${esc(value)}</p></article>`).join('')}</div><details class="dynamic-extra"><summary>检索标签与观测限制</summary><p>${esc(m.limitations)}</p><div class="tag-list">${m.retrievalTags.map(tag=>`<span class="tag">${esc(tag)}</span>`).join('')}</div></details></div></section></div>`}return dynamicHeader()+`<div class="dynamic-analysis">${list}<main class="dynamic-detail">${common}${panel}</main></div>`}
</script>

.pac-tag-search:focus-within{border-color:var(--text-accent)}
.pac-tag-count{margin:0 0 12px;color:var(--text-secondary);font-size:var(--fs-small)}
.pac-tag-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pac-tag-group{min-width:0;padding:14px;border:1px solid var(--border);border-radius:8px;background:#0d1928}
.pac-tag-group header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pac-tag-group h2{margin:0;color:var(--text-title);font-size:var(--fs-body);font-weight:var(--fw-semibold)}
.pac-tag-group small{color:var(--text-tertiary);font-size:var(--fs-caption);white-space:nowrap}
.pac-tag-values{display:flex;flex-wrap:wrap;gap:7px}
.pac-tag{max-width:100%;min-height:32px;padding:5px 10px;border:1px solid #2b4158;border-radius:6px;background:#142438;color:var(--text-primary);font:inherit;font-size:var(--fs-small);overflow-wrap:anywhere;text-align:left;cursor:pointer}
.pac-tag:hover,.pac-tag:focus-visible{border-color:var(--text-accent);color:var(--text-accent)}
.pac-tag-dialog{position:fixed;inset:0;width:min(440px,calc(100% - 32px));max-height:calc(100dvh - 32px);margin:auto;padding:20px;overflow:auto;border:1px solid #3a5a73;border-radius:10px;background:#102033;color:var(--text-primary);box-shadow:0 18px 56px #030a138c}
.pac-tag-dialog::backdrop{background:#030a13be}
.pac-tag-dialog h2{margin:0 0 16px;font-size:var(--fs-h2)}
.pac-tag-dialog form,.pac-tag-dialog label{display:grid;gap:8px}
.pac-tag-dialog form{gap:14px}
.pac-tag-dialog label,.pac-tag-dialog p{color:var(--text-secondary);font-size:var(--fs-small)}
.pac-tag-dialog input,.pac-tag-dialog select{width:100%;min-height:38px;padding:8px 10px;border:1px solid #35546a;border-radius:6px;background:#0b1927;color:var(--text-primary);font:inherit}
.pac-tag-dialog footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.pac-tag-dialog [data-tag-action="remove"]{margin-right:auto}
.pac-tag-dialog [data-tag-error]{margin:0;color:var(--text-danger)}
@media(max-width:1200px){.pac-tag-groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.pac-tag-groups{grid-template-columns:minmax(0,1fr)}.pac-tag-search{flex:1 1 175px;width:auto}}
</style>
<script>
const PAC_KEY='seetime-personal-analysis-config-v1';
let pacState={tab:'tags',tagQuery:'',promptName:'',promptVersion:'',promptId:'',promptExpandedName:'',promptCreating:false,promptBaseId:''};
function pacStaticTags(){return (window.SeeTimeMapOps?.staticTagCategories||[]).flatMap((group,index)=>group.values.map((name,valueIndex)=>({id:`t${index+1}-${valueIndex+1}`,name,category:group.category})))}
function pacTagCategory(name){return window.SeeTimeMapOps?.staticTagCategories?.find(group=>group.values.includes(name))?.category||'自定义'}
function pacLoad(){try{const v=JSON.parse(localStorage.getItem(PAC_KEY)||'null');if(v?.tags&&v?.prompts){const legacy=['车辆','行人','排队','车位','道路','步行区域'],names=v.tags.map(tag=>tag.name);return names.length===legacy.length&&names.every((name,index)=>name===legacy[index])?{...v,tags:pacStaticTags()}:v}}catch{}return {tags:pacStaticTags(),prompts:[{id:'p1',name:'公共空间单次观测',version:'1.0',status:'已发布',content:'请基于当前图片描述可见场景、人员与车辆活动。只陈述画面可支持的事实；遮挡或证据不足时明确说明不确定，不推断画面之外的信息。',logs:[{time:'2026-11-01 10:30',text:'初始版本发布'}]},{id:'p2',name:'停车场单次观测',version:'1.1',status:'草稿',content:'识别当前画面可见的车辆、车位与排队情况。区分已观测到、未观测到和无法判断；不得根据单张图片推断连续变化。',logs:[{time:'2026-11-02 09:20',text:'保存草稿 · 补充车位与排队结果边界'}]}]}}
function pacSave(data){localStorage.setItem(PAC_KEY,JSON.stringify(data))}
function pacTagGroups(tags){
 const query=pacState.tagQuery.trim().toLowerCase();
 const matches=tags.filter(tag=>tag.name.toLowerCase().includes(query));
 const groups=new Map((window.SeeTimeMapOps?.staticTagCategories||[]).map(group=>[group.category,[]]));
 for(const tag of matches){
  const category=tag.category||pacTagCategory(tag.name);
  if(!groups.has(category))groups.set(category,[]);
  groups.get(category).push(tag);
 }
 const cards=[...groups].filter(([,items])=>items.length).map(([category,items])=>`
  <section class="pac-tag-group"><header><h2>${esc(category)}</h2><small>${items.length} 个标签</small></header>
  <div class="pac-tag-values">${items.map(tag=>`<button type="button" class="pac-tag" data-pac="tag-edit" data-id="${esc(tag.id)}" aria-label="编辑标签 ${esc(tag.name)}">${esc(tag.name)}</button>`).join('')}</div></section>`).join('');
 return `<p class="pac-tag-count">${query?`找到 ${matches.length} / ${tags.length} 个标签`:`共 ${tags.length} 个标签`} · 点击标签编辑</p>
  ${cards?`<div class="pac-tag-groups">${cards}</div>`:`<p class="empty">${query?'没有匹配的标签。':'暂无标签，可点击「新增标签」开始添加。'}</p>`}`;
}
function pacOpenTagDialog(id=''){
 const tag=pacLoad().tags.find(item=>item.id===id);
 if(id&&!tag)return;
 const category=tag?.category||pacTagCategory(tag?.name);
 const categories=[...new Set([...(window.SeeTimeMapOps?.staticTagCategories||[]).map(group=>group.category),'自定义',category])];
 const dialog=document.createElement('dialog');
 dialog.className='pac-tag-dialog';
 dialog.setAttribute('aria-labelledby','pac-tag-dialog-title');
 dialog.innerHTML=`
  <section data-tag-editor><h2 id="pac-tag-dialog-title">${tag?'编辑标签':'新增标签'}</h2>
  <form data-tag-save>
   <label>标签名称<input name="name" value="${esc(tag?.name||'')}" required autofocus></label>
   <label>标签类别<select name="category">${categories.map(value=>`<option value="${esc(value)}" ${value===category?'selected':''}>${esc(value)}</option>`).join('')}</select></label>
   <p data-tag-error role="alert" hidden></p>
   <footer>${tag?'<button type="button" class="button danger" data-tag-action="remove">删除标签</button>':''}<button type="button" class="button ghost" data-tag-action="close">取消</button><button class="button primary" type="submit">${tag?'保存修改':'新增标签'}</button></footer>
  </form></section>
  ${tag?`<section data-tag-remove hidden><h2 id="pac-tag-remove-title">删除标签</h2><p>确定从静态标签配置删除「${esc(tag.name)}」？</p>
   <p data-tag-error role="alert" hidden></p>
   <footer><button type="button" class="button ghost" data-tag-action="back">返回编辑</button><button type="button" class="button danger" data-tag-action="confirm-remove">确认删除</button></footer></section>`:''}`;
 const editor=dialog.querySelector('[data-tag-editor]'),remove=dialog.querySelector('[data-tag-remove]');
 const showError=(section,message)=>{const error=section.querySelector('[data-tag-error]');error.textContent=message;error.hidden=false};
 const finish=message=>{
  dialog.close();
  render();
  const edited=id&&document.querySelector(`[data-pac="tag-edit"][data-id="${CSS.escape(id)}"]`);
  (edited||document.querySelector('[data-pac="tag-add"]'))?.focus({preventScroll:true});
  notify(message);
 };
 dialog.addEventListener('close',()=>dialog.remove(),{once:true});
 dialog.addEventListener('click',event=>{
  switch(event.target.closest('button')?.dataset.tagAction){
   case 'close':dialog.close();break;
   case 'remove':
    editor.hidden=true;
    remove.hidden=false;
    dialog.setAttribute('aria-labelledby','pac-tag-remove-title');
    remove.querySelector('[data-tag-action="back"]').focus();
    break;
   case 'back':
    remove.hidden=true;
    editor.hidden=false;
    dialog.setAttribute('aria-labelledby','pac-tag-dialog-title');
    editor.querySelector('[data-tag-action="remove"]').focus();
    break;
   case 'confirm-remove':{
    const data=pacLoad();
    data.tags=data.tags.filter(item=>item.id!==id);
    try{pacSave(data)}catch{showError(remove,'无法删除标签，请检查浏览器存储后重试。');return}
    finish('标签已删除');
    break;
   }
  }
 });
 dialog.addEventListener('submit',event=>{
  event.preventDefault();
  const form=event.target,values=new FormData(form),name=String(values.get('name')||'').trim(),category=String(values.get('category')||'自定义');
  const data=pacLoad(),item=data.tags.find(entry=>entry.id===id);
  if(id&&!item){showError(editor,'此标签已删除，请关闭后重新查看。');return}
  if(!name){showError(editor,'请输入标签名称。');form.elements.name.focus();return}
  if(data.tags.some(entry=>entry.id!==id&&entry.name.toLowerCase()===name.toLowerCase())){showError(editor,'标签名称已存在。');form.elements.name.focus();return}
  if(item)Object.assign(item,{name,category});
  else data.tags.push({id:`t${Date.now()}`,name,category});
  try{pacSave(data)}catch{showError(editor,'无法保存标签，请检查浏览器存储后重试。');return}
  if(!item)pacState.tagQuery='';
  finish(item?'标签已保存':'标签已新增');
 });
 document.getElementById('app').append(dialog);
 dialog.showModal();
}
function pacPromptTime(prompt){const value=Date.parse(prompt.logs?.[0]?.time||'');return Number.isFinite(value)?value:0}
function pacPage(){
 const data=pacLoad(),prompts=data.prompts.filter(x=>(!pacState.promptName||x.name.toLowerCase().includes(pacState.promptName.toLowerCase()))&&(!pacState.promptVersion||x.version.toLowerCase().includes(pacState.promptVersion.toLowerCase()))).sort((a,b)=>pacPromptTime(b)-pacPromptTime(a));
 if(!pacState.promptCreating&&!prompts.some(x=>x.id===pacState.promptId))pacState.promptId=prompts[0]?.id||'';
 const selected=data.prompts.find(x=>x.id===pacState.promptId),basePrompt=data.prompts.find(x=>x.id===pacState.promptBaseId),groups=[...new Set(prompts.map(x=>x.name))].map(name=>({name,items:data.prompts.filter(x=>x.name===name).sort((a,b)=>pacPromptTime(b)-pacPromptTime(a))})),
 tagsView=`<div class="pac-toolbar pac-tag-toolbar"><label class="pac-tag-search"><span class="visually-hidden">搜索标签名称</span>${icon('search')}<input data-pac-tag-query value="${esc(pacState.tagQuery)}" placeholder="搜索标签名称"></label><button class="button primary" type="button" data-pac="tag-add">${icon('plus')}新增标签</button></div><div data-pac-tag-results>${pacTagGroups(data.tags)}</div>`,
 promptToolbar=`<form class="pac-prompt-toolbar" data-pac-prompt-search><div class="pac-prompt-filters"><label class="pac-prompt-filter"><span>提示词名称</span><input name="name" value="${esc(pacState.promptName)}" placeholder="按名称搜索"></label><label class="pac-prompt-filter version"><span>版本</span><input name="version" value="${esc(pacState.promptVersion)}" placeholder="如 1.0"></label><button class="button ghost" type="submit">查询</button></div><button class="button primary" type="button" data-pac="prompt-new">${icon('plus')}新建提示词</button></form>`,
 promptList=`<section class="box pac-prompt-list"><header class="pac-prompt-list-head"><div><h2>提示词库</h2><p>${groups.length} 个提示词 · ${prompts.length} 个版本</p></div></header>${groups.map(group=>{const isOpen=group.name===pacState.promptExpandedName||Boolean(pacState.promptVersion),latest=group.items[0],history=group.items.slice(1).filter(x=>!pacState.promptVersion||x.version.toLowerCase().includes(pacState.promptVersion.toLowerCase()));return `<section class="pac-version-group"><button type="button" class="pac-prompt-group ${latest.id===pacState.promptId?'active':''}" data-pac="prompt-select" data-id="${esc(latest.id)}" aria-current="${latest.id===pacState.promptId?'true':'false'}"><span class="pac-prompt-group-copy"><strong>${esc(group.name)}</strong><small>最新 · ${esc(latest.version)} · ${esc(latest.status)}</small></span><span class="status ${latest.status==='草稿'?'warn':'neutral'}">${esc(latest.status)}</span></button>${history.length?`<button type="button" class="pac-history-toggle" data-pac="prompt-group" data-name="${esc(group.name)}" aria-expanded="${isOpen}">${icon('chevron')}<span>${isOpen?'收起':'查看'} ${history.length} 个历史版本</span></button>${isOpen?`<div class="pac-version-history">${history.map(item=>`<button type="button" class="pac-version-item ${item.id===pacState.promptId?'active':''}" data-pac="prompt-select" data-id="${esc(item.id)}"><span>v${esc(item.version)}</span><span class="pac-version-status ${item.status==='草稿'?'draft':''}">${esc(item.status)}</span><small>${esc(item.logs?.[0]?.time||'暂无更新时间')}</small></button>`).join('')}</div>`:''}`:''}</section>`}).join('')||'<div class="empty">没有匹配的提示词版本。</div>'}</section>`,
 formPrompt=pacState.promptCreating?{name:basePrompt?.name||'',version:'',content:basePrompt?.content||''}:selected,
 promptEditor=pacState.promptCreating||selected?`<section class="box pac-prompt-editor"><header class="pac-prompt-editor-head"><div><div class="pac-prompt-editor-kicker">${pacState.promptCreating?(basePrompt?'新版本草稿':'新建提示词'):'提示词版本'}</div><h2>${esc(formPrompt?.name||'新提示词')}</h2><p>${pacState.promptCreating?'填写版本信息与提示词正文，保存后进入版本列表。':`${esc(selected.version)} · ${esc(selected.status)}${selected.logs?.[0]?.time?` · 更新于 ${esc(selected.logs[0].time)}`:''}`}</p></div><span class="status ${selected?.status==='草稿'||pacState.promptCreating?'warn':'neutral'}">${pacState.promptCreating?'未保存草稿':esc(selected?.status||'')}</span></header>${pacState.promptCreating||selected?.status==='草稿'?`<form class="pac-prompt-form" data-pac-prompt-save="${esc(selected?.id||'new')}"><div class="pac-prompt-meta"><label class="pac-form-field"><span>提示词名称</span><input name="name" data-pac-prompt-name value="${esc(formPrompt?.name||'')}" placeholder="例如：公共空间单次观测" required></label><label class="pac-form-field"><span>提示词版本</span><input name="version" value="${esc(formPrompt?.version||'')}" placeholder="填写版本号，如 1.1" required></label></div><label class="pac-form-field"><span>提示词正文</span><textarea name="content" placeholder="编写本版本的分析指令" spellcheck="false">${esc(formPrompt?.content||'')}</textarea></label><label class="pac-form-field"><span>本次更新说明 <small>用于版本日志</small></span><input name="change" placeholder="例如：补充遮挡场景下的不确定性描述"></label><footer class="pac-prompt-actions"><button class="button ghost" type="button" data-pac="prompt-cancel">取消</button><span><button class="button ghost" type="submit" name="intent" value="draft">保存草稿</button><button class="button primary" type="submit" name="intent" value="publish">保存并发布</button></span></footer></form>`:`<div class="pac-prompt-readonly"><div class="pac-readonly-label">提示词正文</div><pre>${esc(selected.content||'暂无提示词正文')}</pre><div class="pac-prompt-actions"><span class="muted">已发布版本保留为历史记录</span><button class="button primary" type="button" data-pac="prompt-clone" data-id="${esc(selected.id)}">基于此版本创建草稿</button></div></div>`}</section>`:`<section class="box pac-prompt-empty"><div><h2>选择一个版本查看</h2><p>左侧按提示词名称分组，展开可快速定位历史版本。</p></div><button class="button primary" type="button" data-pac="prompt-new">${icon('plus')}新建提示词</button></section>`,
 logs=selected?`<section class="box pac-prompt-log"><header><div><h3>版本更新日志</h3><p>${(selected.logs||[]).length} 条记录 · 当前版本 ${esc(selected.version)}</p></div></header><ol>${(selected.logs||[]).map(l=>`<li><time>${esc(l.time)}</time><span>${esc(l.text)}</span></li>`).join('')||'<li class="muted">暂无更新记录</li>'}</ol></section>`:'';
 const promptView=`${promptToolbar}<div class="pac-prompt-layout">${promptList}<div class="pac-prompt-workspace">${promptEditor}${logs}</div></div>`;
 return `<div class="page-heading"><div><h1>个人版静态标签</h1><p>管理个人版相机静态标签。配置保存在当前浏览器。</p></div></div><section class="box detail-content"><nav class="pac-tabs" role="tablist" aria-label="个人版分析配置"><button class="pac-tab" role="tab" aria-selected="${pacState.tab==='tags'}" data-pac="tab" data-tab="tags">静态标签</button><button class="pac-tab" type="button" data-route="analysisConfig">分析提示词配置</button></nav>${pacState.tab==='tags'?tagsView:promptView}</section>`
}
const pacOldRender=render;
render=function(){if(state.route==='personalAnalysisConfig'){const content=!can(state.route)||!can('projects')?noPermission():!currentProject()?`<div class="box empty"><h2>先选择一个项目</h2><p>进入项目空间后管理分析配置。</p>${routeButton('进入项目池','projects','primary')}</div>`:pacPage();document.getElementById('app').innerHTML=shell(content);document.title='个人版分析配置 · SeeTime';return}pacOldRender()};
const pacBaseCameraPoi=cameraPoi;
cameraPoi=function(cam,...args){return cam?._dynamicPoi||pacBaseCameraPoi(cam,...args)};
const pacBaseDynamicCameras=dynamicCameras;
dynamicCameras=function(){const base=pacBaseDynamicCameras(),prototype=base[0]||projectCameras()[0];if(!prototype)return base;const districts=info().districts,seed=[['poi-demo-1','湖滨步行街','商业街区',districts[0]],['poi-demo-2','钱江新城公园','公园·绿地',districts[1]||districts[0]],['poi-demo-3','延安路步行街','公共空间',districts[0]],['poi-demo-4','钱江新城停车场','停车场',districts[1]||districts[0]]],extras=[];seed.forEach((p,i)=>{const poi={id:p[0],name:p[1],category:p[2],district:p[3]};for(let j=0;j<(i===3?3:2);j++){extras.push({...prototype,id:`DEMO-D${String(i*3+j+1).padStart(2,'0')}`,name:`${p[1]} · ${['东向','入口','广场'][j]}`,district:p[3],mountedPoiId:'',personalSubscribed:true,quality:j===1?'需复核':'清晰',_dynamicPoi:poi})}});return [...base,...extras]};
document.addEventListener('click',e=>{const b=e.target.closest?.('[data-pac]');if(!b)return;e.preventDefault();const d=pacLoad(),id=b.dataset.id;switch(b.dataset.pac){case'tab':pacState.tab=b.dataset.tab;break;case'tag-add':pacOpenTagDialog();return;case'tag-edit':pacOpenTagDialog(id);return;case'prompt-select':{const selected=d.prompts.find(x=>x.id===id);pacState.promptId=id;pacState.promptExpandedName=selected?.name||'';pacState.promptCreating=false;pacState.promptBaseId='';break}case'prompt-group':pacState.promptExpandedName=pacState.promptExpandedName===b.dataset.name?'':b.dataset.name;break;case'prompt-new':pacState.promptCreating=true;pacState.promptBaseId='';pacState.promptId='';pacState.promptName='';pacState.promptVersion='';break;case'prompt-clone':pacState.promptCreating=true;pacState.promptBaseId=id;pacState.promptId='';break;case'prompt-cancel':pacState.promptCreating=false;pacState.promptId=pacState.promptBaseId||pacState.promptId;pacState.promptBaseId='';break}render();if(b.dataset.pac==='prompt-new'||b.dataset.pac==='prompt-clone')document.querySelector('[data-pac-prompt-name]')?.focus()},true);
document.addEventListener('input',e=>{
 if(!e.target.matches('[data-pac-tag-query]'))return;
 pacState.tagQuery=e.target.value;
 document.querySelector('[data-pac-tag-results]').innerHTML=pacTagGroups(pacLoad().tags);
},true);
document.addEventListener('submit',e=>{const f=e.target;if(f.matches('[data-pac-prompt-search]')){e.preventDefault();e.stopImmediatePropagation();const v=new FormData(f);pacState.promptName=String(v.get('name')||'').trim();pacState.promptVersion=String(v.get('version')||'').trim();pacState.promptId='';pacState.promptCreating=false;pacState.promptBaseId='';render();return}if(f.matches('[data-pac-prompt-save]')){e.preventDefault();e.stopImmediatePropagation();const d=pacLoad(),v=new FormData(f),intent=e.submitter?.value||'draft',name=String(v.get('name')||'').trim(),version=String(v.get('version')||'').trim(),content=String(v.get('content')||''),change=String(v.get('change')||'').trim(),isNew=pacState.promptCreating,item=isNew?null:d.prompts.find(x=>x.id===f.dataset.pacPromptSave);if(intent==='publish'&&!content.trim()){notify('请先填写提示词正文，再发布');return}if(d.prompts.some(x=>x.id!==item?.id&&x.name.toLowerCase()===name.toLowerCase()&&x.version.toLowerCase()===version.toLowerCase())){notify('同一提示词下版本号不能重复');return}const time=new Date().toLocaleString('zh-CN',{hour12:false}),logText=`${isNew?(intent==='publish'?'创建并发布':'创建草稿'):(intent==='publish'?'发布版本':'保存草稿')}${change?` · ${change}`:''}`;if(isNew){const created={id:`p${Date.now()}`,name,version,status:intent==='publish'?'已发布':'草稿',content,logs:[{time,text:logText}]};d.prompts.unshift(created);pacState.promptId=created.id;pacState.promptExpandedName=name;pacState.promptCreating=false;pacState.promptBaseId=''}else if(item){item.name=name;item.version=version;item.content=content;item.status=intent==='publish'?'已发布':'草稿';item.logs=item.logs||[];item.logs.unshift({time,text:logText});pacState.promptExpandedName=name}pacState.promptName='';pacState.promptVersion='';pacSave(d);notify(intent==='publish'?'提示词版本已发布（本地演示）':'草稿已保存');render()}},true);</script>
<style>
