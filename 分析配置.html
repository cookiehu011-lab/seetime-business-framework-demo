<style>

#toast{position:fixed;bottom:22px;right:22px;max-width:calc(100% - 44px);background:#ffffff;border:1px solid #bae6fd;border-radius:8px;padding:9px 14px;box-shadow:0 8px 30px #0f172a66;z-index:2}

  <div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3.5 26 9.3v12L16 28.5 6 22.7V10.5Z M6 22.7l10-7 10 5.6M16 15.7V3.5" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/></svg>SeeTime</div>

  <div class="heading"><div><div id="scope-path" class="scope-path"></div><h1 id="page-title">分析配置</h1><p id="page-description"></p></div></div>

<script src="分析配置迁移.js?v=20261106"></script>
<script>
'use strict';
const key = 'seetime-analysis-config-standalone-v1';
const apps = ['个人版', '治理版'];
const tasks = ['相机单次观测', '相机周期分析', '事件识别', '设施巡查'];
const categories = ['空间与场地', '自然景观', '步行与休憩设施', '文化与建筑', '交通与公共设施', '场景体验'];
const byId = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e = escapeHtml;
const cleanVersion = value => value.trim().replace(/^v/i, '').toLowerCase();
const versionLabel = version => 'v' + version;
const timestamp = () => new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Shanghai', dateStyle:'short', timeStyle:'short'}).format(new Date());
const newId = () => globalThis.crypto?.randomUUID?.() || Date.now().toString(36) + Math.random().toString(36).slice(2);
const observation = '你是 SeeTime 的公共空间观测助手。根据输入的单帧图片，输出画面中可见、对用户有用的信息。\n\n1. 画面描述：简要说明可见的空间、设施及活动。\n2. 静态标签：输出最多六个可用于检索的中文标签。\n3. 人员与车辆：仅描述画面中可见的情况，使用「较少 / 中等 / 较多」。\n4. 无法判断时写明「不确定」，不推断画面外信息。\n\n以 JSON 返回 description、tags、people、vehicles。';
const seedTagNames = [
  ['公共广场','商业街区','停车场','步行入口'],
  ['绿地','湖面','林荫道'],
  ['步道','座椅','休憩区'],
  ['历史建筑','公共建筑','展馆'],
  ['人行横道','公交站','照明设施'],
  ['适合散步','开阔视野','沿街商业']
];
function seededPrompt(id, app, task, name, body, numbers, active) {
  const versions = numbers.map((number, index) => ({
    number, body: index ? body + '\n\n' + (index % 2 ? '补充约束：画面模糊或遮挡时，将对应结果标记为未知。' : '补充约束：优先保留可用于下游检索的稳定字段。') : body,
    note: index ? '调整观察范围和输出说明' : '初始样例版本',
    time: '2026-11-' + String(Math.max(1, 6 - index)).padStart(2, '0') + ' 10:30',
    published: true
  }));
  return {
    id, app, task, name, active, versions,
    logs: versions.slice(0, 5).map(v => ({type:'发布版本', version:v.number, note:v.note, time:v.time, actor:'示例管理员'}))
  };
}
function seed() {
  return {
    prompts:[
      seededPrompt('public','个人版','相机单次观测','公共空间观测',observation,['1.2','1.1','1.0','0.9','0.8','0.7','0.6','0.5','0.4','0.3','0.2','0.1'],'1.2'),
      seededPrompt('parking','个人版','相机单次观测','停车场观测','基于图片描述停车场可见区域。若能识别车位标线，给出占用情况；无法判断时返回未知。',['1.1','1.0'],'1.1'),
      seededPrompt('period','个人版','相机周期分析','周期变化总结','按观测时间汇总一路相机的有效样本。概括观察到的变化与样本缺口，保留可追溯的观测时间。',['1.0'],'1.0'),
      seededPrompt('order','治理版','事件识别','公共空间秩序识别','提取画面中可核对的事件线索，返回事件类别、可见事实和证据时间。把不确定项交给人工核验。',['2.0','1.0'],'2.0'),
      seededPrompt('facility','治理版','设施巡查','设施状态巡查','检查画面可见的公共设施状态。输出设施类别、可见状态和复核建议。',['1.3','1.2'],'1.3')
    ],
    tags:seedTagNames.flatMap((names, i) => names.map((name, j) => ({id:'t-'+i+'-'+j, name, category:categories[i], app:'个人版', enabled:true})))
  };
}
function load() {
  try {
    const stored = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(stored?.prompts) && Array.isArray(stored?.tags)) return stored;
  } catch {}
  return seed();
}

function openDialog(title, fields, button, submit) {
  const dialog=byId('dialog');
  dialog.innerHTML=`<form><div class="dialog-head"><h2 id="dialog-title">${e(title)}</h2>
  <button type="button" class="icon-close" data-close aria-label="关闭">×</button></div>
  <div class="dialog-body">${fields}<div class="error" role="alert"></div></div>
  <div class="dialog-foot"><button type="button" data-close>取消</button><button class="primary" type="submit">${e(button)}</button></div></form>`;
  dialog.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>dialog.close());
  dialog.querySelector('form').onsubmit=ev=>{
    ev.preventDefault();
    const form=ev.currentTarget;
    const previous=JSON.stringify(data);
    const result=submit(Object.fromEntries(new FormData(form)));
    if(storageFailed){data=JSON.parse(previous);form.querySelector('.error').textContent='保存失败，请重试。';return;}
    if (typeof result==='string') form.querySelector('.error').textContent=result;
    else { dialog.close(); render(); }
  };
  dialog.showModal();
  (dialog.querySelector('input,select,textarea')||dialog.querySelector('.dialog-foot button')).focus();
}

function createPrompt() {

    <div class="form-grid">${control('所属应用',`<select name="app">${apps.map(x=>option(x,x,state.app||apps[0])).join('')}</select>`)}

    '创建草稿',({name,app,task,number})=>{
      name=name.trim(); number=cleanVersion(number);

function validVersion(number) { return /^\d{1,6}(\.\d{1,6}){1,2}$/.test(number); }
function createVersion(p,v) {
  const source=v?.published?v:defaultVersion(p);
  const parts=source.number.split('.');
  parts[parts.length-1]=String(Number(parts.at(-1))+1);
  openDialog('创建新版本',`
    ${control('版本号',`<input name="number" required maxlength="20" value="${e(parts.join('.'))}">`)}
    <p class="hint">复制 ${e(versionLabel(source.number))} 的已保存正文作为新草稿。</p>`,
    '创建草稿',({number})=>{
      number=cleanVersion(number);
      if(!validVersion(number)) return '请输入数字版本号，例如 1.0 或 1.2.1。';
      if(getVersion(p,number)) return '版本号已存在，请换一个版本号。';
      const draft={number,body:source.body,note:'',published:false,time:timestamp()};
      p.versions.unshift(draft);
      log(p,'创建草稿',draft,'复制自 '+versionLabel(source.number));
      state.detail='body'; state.viewed=number; state.trial=null;
      save('版本草稿已创建');
    });

    order:['秩序核验样例',{event_candidate:'通道堆放线索',evidence:'画面可见通道边有物品',review:'待人工核验'}],
    facility:['设施巡查样例',{facility:'照明设施',visible_state:'无法判断是否亮灯',review:'待人工核验'}],
    public:['公共空间样例',{description:'步行空间可见行人与休憩座椅。',tags:['步道','座椅'],people:'中等',vehicles:'不确定'}]
  };
  const taskSample={'相机单次观测':'public','相机周期分析':'period','事件识别':'order','设施巡查':'facility'};
  const [sample,output]=samples[p.id]||samples[taskSample[p.task]];
  state.trial={promptId:p.id,number:v.number,body,length:body.length,sample,output};
  byId('trial-output').outerHTML=trialContent(state.trial);
}
function publish(p,v) {
  const fields=draftFields();
  if(!fields.body||!fields.note) { draftError('请填写提示词正文和更新说明。'); return; }
  const trial=state.trial;
  if(trial?.promptId!==p.id||trial?.number!==v.number||trial?.body!==fields.body) {
    draftError('请先试跑当前正文。修改正文后需要重新试跑。'); return;
  }
  const previous=p.active?versionLabel(p.active):'无生效版本';
  openDialog('发布版本',`<p>确认将 <b>${e(p.name)} ${e(versionLabel(v.number))}</b> 设为生效版本？</p>
    <div class="impact"><strong>${e(p.app)} · ${e(p.task)}</strong><br>版本变更：${e(previous)} → ${e(versionLabel(v.number))}<br>适用范围：使用此提示词的平台项目。</div>
    <p class="hint">本次操作仅更新本地演示状态。历史分析仍对应原版本。</p>`,
    '确认发布',()=>{
      Object.assign(v,fields,{published:true,time:timestamp()});
      p.active=v.number;
      log(p,'发布版本',v,previous+' → '+versionLabel(v.number)+' · '+fields.note);
      save('版本已发布并生效');
    });
}
function rollback(p,v) {
  openDialog('回滚版本',`<p>将 <b>${e(p.name)}</b> 的生效版本从 ${e(versionLabel(p.active))} 切换到 <b>${e(versionLabel(v.number))}</b>。</p>
    <div class="impact">${e(p.app)} · ${e(p.task)}<br>后续分析使用回滚后的版本。版本记录和历史结果均保留。</div>
    ${control('回滚原因','<input name="reason" required maxlength="160" placeholder="例如：恢复上一版输出格式">')}`,
    '确认回滚',({reason})=>{
      if(!reason.trim()) return '请填写回滚原因。';
      const previous=p.active;
      p.active=v.number;
      log(p,'回滚版本',v,versionLabel(previous)+' → '+versionLabel(v.number)+' · '+reason.trim());
      save('已回滚到 '+versionLabel(v.number));
    });
}
function editTag(t) {
  let continueAdding=false;
  openDialog(t?'编辑标签':'新增标签',`
    ${control('标签分类',`<select name="category">${data.categories.map(x=>option(x,x,t?.category||state.tagCategory||'未分类')).join('')}</select>`)}
    ${control('标签名称',`<input name="name" required maxlength="30" value="${e(t?.name||'')}" placeholder="例如：步行入口">`)}`,
    '保存标签',({name,category})=>{
      name=name.trim();
      if(!name) return '请输入标签名称。';
      if(name!==t?.name&&personalTags().some(item=>item.name===name)) return '个人版已有同名标签。';
      if(t){if(t.name!==name)t.previousNames=[...new Set([...(t.previousNames||[]),t.name])];Object.assign(t,{name,category,app:'个人版'});}
      else {
        data.tags.unshift({id:newId(),name,category,app:'个人版',enabled:true,references:0});
        clearTagFilters();
      }
      save(t?'标签已更新':'标签已新增');
      if(continueAdding&&!storageFailed) setTimeout(()=>editTag(),0);
    });
  if(!t) {
    const more=document.createElement('button'); more.type='submit';more.textContent='保存并继续新增';
    more.onclick=()=>{continueAdding=true;};
    byId('dialog').querySelector('.primary').onclick=()=>{continueAdding=false;};
    byId('dialog').querySelector('.dialog-foot').append(more);
  }
}
function deleteTag(t) {
  if(t.references) return;
  openDialog('删除标签',`<p>删除「${e(t.name)}」？此标签未被相机引用。</p>`,'确认删除',()=>{data.tags=data.tags.filter(x=>x.id!==t.id);save('标签已删除');});
}
function manageCategories() {
  openDialog('管理分类',`<p class="hint">修改名称会同步分类；移除分类时，其标签归入「未分类」。</p>
  <div class="category-rows">${data.categories.filter(x=>x!=='未分类').map((x,i)=>`<label class="category-row"><input name="category-${i}" value="${e(x)}" required maxlength="24" aria-label="分类名称 ${e(x)}"><span><input type="checkbox" name="remove-${i}"> 移除</span></label>`).join('')}</div>
  ${control('新增分类','<input name="newCategory" maxlength="24" placeholder="输入分类名称（选填）">')}`,'保存分类',fields=>{
    const old=data.categories.filter(x=>x!=='未分类'),names=old.map((x,i)=>fields['remove-'+i]?null:fields['category-'+i].trim()),extra=fields.newCategory.trim();
    const next=['未分类',...names.filter(x=>x!==null),...(extra?[extra]:[])];
    if(next.some(x=>!x)) return '分类名称不能为空。';
    if(new Set(next).size!==next.length) return '分类名称不能重复。';
    data.tags.forEach(t=>{const i=old.indexOf(t.category);if(i>=0)t.category=names[i]||'未分类';});
    data.categories=next;state.tagCategory='';save('分类已更新');
  });
}

function toggleTag(t) {
  if(t.enabled) {
    openDialog('停用标签',`<p>停用「${e(t.name)}」后，此标签将从可选词库中移除。历史相机记录保留原标签。</p>`,'确认停用',()=>{
      t.enabled=false; save('标签已停用');
    });
  } else { t.enabled=true; save('标签已启用');if(storageFailed)t.enabled=false; render(); }
}
function clearTagFilters() {
  Object.assign(state,{tagName:'',tagCategory:'',tagStatus:'',tagPage:1,tagFocus:''});
}
function draftDirty() {
  if(storageFailed)return true;
  const p=currentPrompt(),v=selectedVersion(p||{versions:[]});
  if(!byId('draft')||!v||v.published) return false;
  const fields=draftFields();
  return fields.body!==v.body||fields.note!==v.note;
}
function navigate(apply) {
  if(!draftDirty()) { apply(); render(); return; }
  openDialog('草稿尚未保存','<p>切换后将放弃本次未保存的修改。</p>','放弃修改',()=>{ apply(); });
}
function changeFilter(event) {
  const field=event.target,name=field.dataset.filter;
  if(!name||!field.isConnected||event.isComposing) return;
  if(field.tagName==='INPUT' ? event.type==='change' : event.type!=='change') return;
  if(draftDirty()&&state.page==='prompts') {
    field.value=state[name];
    toast('请先保存草稿，再调整筛选条件。');
    return;
  }
  state[name]=field.value;
  if(name.startsWith('tag'))state.tagPage=1;
  if(name==='version') { state.viewed=''; state.historyQuery=''; state.trial=null; }
  if(state.page==='prompts') reconcilePrompt();
  render({keepFocus:true});
}
document.addEventListener('compositionend',changeFilter);
document.addEventListener('input',changeFilter);
document.addEventListener('change',changeFilter);
document.addEventListener('input',event=>{
  if(!event.target.closest('#draft')) return;
  if(event.target.name==='body') event.target.closest('.prompt-input').querySelector('.input-foot span:last-child').textContent=event.target.value.length+' 字';
  draftError('');
  if(event.target.name==='body'&&state.trial) {
    state.trial=null;
    byId('trial-output').outerHTML='<div id="trial-output"></div>';
  }
});
document.addEventListener('submit',event=>{
  if(event.target.id!=='draft') return;
  event.preventDefault();
  const p=currentPrompt(),v=selectedVersion(p);
  saveDraft(p,v,draftFields());
  render();
});
document.addEventListener('click',event=>{
  const b=event.target.closest('[data-action]');
  if(!b) return;
  const {action,value}=b.dataset,p=currentPrompt(),v=p?selectedVersion(p):null;
  switch(action) {
    case 'expand-editor': toggleEditor();break;
    case 'page': if(state.page!==value) navigate(()=>{state.page=value;}); break;
    case 'app': if(state.app!==value) navigate(()=>{state.app=value;clearPromptFilters();reconcilePrompt();}); break;
    case 'prompt': if(state.promptId!==value) navigate(()=>showPrompt(data.prompts.find(x=>x.id===value))); break;
    case 'clear-prompts': navigate(()=>{clearPromptFilters();state.viewed='';reconcilePrompt();}); break;
    case 'new-prompt': if(draftDirty()) toast('请先保存当前草稿。'); else createPrompt(); break;
    case 'new-version': if(draftDirty()) toast('请先保存当前草稿。'); else createVersion(p,v); break;
    case 'detail': if(state.detail!==value) navigate(()=>{state.detail=value;}); break;
    case 'view-version': navigate(()=>{state.viewed=value;state.detail='body';state.trial=null;}); break;
    case 'active-version': navigate(()=>{state.viewed=p.active;state.trial=null;}); break;
    case 'clear-history': state.historyQuery='';state.version='';render();break;
    case 'trial-read': runTrial(p,v,v.body); break;
    case 'trial-draft': draftError('');runTrial(p,v,draftFields().body);break;
    case 'publish': publish(p,v); break;
    case 'rollback': rollback(p,v); break;
    case 'categories': manageCategories();break;
    case 'delete-tag': deleteTag(data.tags.find(t=>t.id===value));break;
    case 'tag-prev': state.tagPage--;render();break;
    case 'tag-next': state.tagPage++;render();break;
    case 'focus-tag-group': state.tagFocus=value;render();document.querySelector('.tag-group.is-current')?.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'clear-tags': clearTagFilters();render();break;
    case 'new-tag': editTag();break;
    case 'edit-tag': editTag(data.tags.find(t=>t.id===value));break;
    case 'toggle-tag': toggleTag(data.tags.find(t=>t.id===value));break;
  }
});
window.addEventListener('beforeunload',event=>{
  if(!draftDirty()) return;
  event.preventDefault();
  event.returnValue='';
});
render();
</script>
