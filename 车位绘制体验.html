<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>车位绘制体验</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    background: #f5f7fa;
    color: #0f172a;
    font: 14px/1.5 "PingFang SC", "Noto Sans SC", sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 0; color: #475569; }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 280px;
    min-height: 0;
  }
  .stage {
    position: relative;
    min-width: 0;
    min-height: 0;
    margin: 16px;
    display: grid;
    place-items: center;
  }
  .stage img {
    max-width: 100%;
    max-height: 100%;
    display: block;
    border-radius: 12px;
    background: #e5e7eb;
    user-select: none;
    -webkit-user-drag: none;
  }
  .stage svg {
    position: absolute;
    touch-action: none;
    cursor: crosshair;
  }
  aside {
    margin: 16px 16px 16px 0;
    padding: 16px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .count { font-size: 28px; font-weight: 600; line-height: 1; }
  .count small { font-size: 14px; font-weight: 500; color: #475569; margin-left: 4px; }
  label { display: grid; gap: 6px; color: #475569; font-size: 13px; }
  input[type="number"] {
    height: 36px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 0 10px;
    font: inherit;
    color: #0f172a;
  }
  .actions { display: grid; gap: 8px; }
  button {
    height: 36px;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    background: #fff;
    color: #0f172a;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #f8fafc; }
  button:disabled { color: #94a3b8; cursor: default; background: #fff; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  .slots { overflow: auto; display: grid; gap: 6px; min-height: 0; }
  .slots button { height: auto; min-height: 36px; text-align: left; padding: 8px 10px; }
  .slots button.selected { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
  .status { margin: 0; min-height: 3em; color: #334155; }
  .hint { margin: 0; color: #64748b; font-size: 12px; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 1fr) auto; }
    aside { margin: 0 16px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>车位绘制</h1>
  <p>依次点四个角。画完可拖动整块或角点，也可以复制到旁边。</p>
</header>
<main>
  <div class="stage" id="stage">
    <img id="photo" alt="停车场画面" src="停车场监控示意.png">
    <svg id="overlay" aria-label="车位绘制层"></svg>
  </div>
  <aside>
    <div>
      <div class="count" id="count">0<small>个已画</small></div>
    </div>
    <label>画面里可见的车位总数
      <input id="total" type="number" min="0" step="1" value="0">
    </label>
    <p class="hint">可以只画出一部分。下面的保存是这张画面上的全部车位，加上这个总数，不是单独一个车位。</p>
    <div class="actions">
      <button type="button" id="copy" disabled>复制到旁边</button>
      <button type="button" id="undo" disabled>撤销上一步</button>
      <button type="button" id="remove" disabled>删除选中</button>
      <button type="button" class="primary" id="keep">保存本画面全部车位</button>
    </div>
    <div class="slots" id="slots" aria-label="已画车位"></div>
    <p class="status" id="status" role="status">在车位的四个角上依次点击。</p>
  </aside>
</main>
<script>
const photo = document.getElementById('photo');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
const totalEl = document.getElementById('total');
const slotsEl = document.getElementById('slots');
const copyBtn = document.getElementById('copy');
const undoBtn = document.getElementById('undo');
const removeBtn = document.getElementById('remove');
let slots = [];
let draft = [];
let selected = -1;
let history = [];
let drag = null;

function say(text) { statusEl.textContent = text; }
function clone(value) { return JSON.parse(JSON.stringify(value)); }
function snapshot() { history.push({ slots: clone(slots), draft: clone(draft), selected }); if (history.length > 40) history.shift(); }
function imageBox() { return photo.getBoundingClientRect(); }
function toImage(clientX, clientY) {
  const box = imageBox();
  return [
    Math.min(1, Math.max(0, (clientX - box.left) / box.width)),
    Math.min(1, Math.max(0, (clientY - box.top) / box.height))
  ];
}
function toScreen(point) {
  const box = imageBox();
  return [box.left + point[0] * box.width, box.top + point[1] * box.height];
}
function screenPerImage() {
  const box = imageBox();
  return box.width / (photo.naturalWidth || box.width);
}
function placeOverlay() {
  const stage = imageBox();
  const host = document.getElementById('stage').getBoundingClientRect();
  overlay.style.left = (stage.left - host.left) + 'px';
  overlay.style.top = (stage.top - host.top) + 'px';
  overlay.style.width = stage.width + 'px';
  overlay.style.height = stage.height + 'px';
  if (photo.naturalWidth) overlay.setAttribute('viewBox', `0 0 ${photo.naturalWidth} ${photo.naturalHeight}`);
}
function px(point) {
  return [point[0] * photo.naturalWidth, point[1] * photo.naturalHeight];
}
function inside(point, polygon) {
  let hit = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const [xi, yi] = polygon[i], [xj, yj] = polygon[j];
    if ((yi > point[1]) !== (yj > point[1]) && point[0] < (xj - xi) * (point[1] - yi) / (yj - yi) + xi) hit = !hit;
  }
  return hit;
}
function nearestHandle(clientX, clientY) {
  const limit = 20;
  let best = null;
  slots.forEach((slot, index) => {
    if (index !== selected) return;
    slot.points.forEach((point, vertex) => {
      const [x, y] = toScreen(point);
      const distance = Math.hypot(x - clientX, y - clientY);
      if (distance <= limit && (!best || distance < best.distance)) best = { index, vertex, distance };
    });
  });
  return best;
}
function stallAt(point) {
  for (let index = slots.length - 1; index >= 0; index -= 1) if (inside(point, slots[index].points)) return index;
  return -1;
}
function sideStep(points) {
  const edge = index => {
    const a = points[index], b = points[(index + 1) % 4];
    return [b[0] - a[0], b[1] - a[1]];
  };
  const length = vector => Math.hypot(vector[0], vector[1]);
  const edges = [0, 1, 2, 3].map(edge);
  const across = length(edges[0]) + length(edges[2]) <= length(edges[1]) + length(edges[3]);
  const first = across ? edges[0] : edges[1];
  const opposite = across ? edges[2] : edges[3];
  return [(first[0] - opposite[0]) / 2, (first[1] - opposite[1]) / 2];
}
function draw() {
  placeOverlay();
  const width = photo.naturalWidth || 1;
  const scale = screenPerImage();
  const handle = Math.max(3, 3.5 / (scale || 1));
  const label = slots.map((slot, index) => {
    const center = slot.points.reduce((sum, point) => [sum[0] + point[0], sum[1] + point[1]], [0, 0]).map(value => value / 4);
    const [cx, cy] = px(center);
    const active = index === selected;
    const polygon = slot.points.map(px).map(point => point.join(',')).join(' ');
    const handles = active ? slot.points.map((point, vertex) => {
      const [x, y] = px(point);
      return `<circle class="handle" data-index="${index}" data-vertex="${vertex}" cx="${x}" cy="${y}" r="${handle}" fill="#fff" stroke="#1d4ed8" stroke-width="${1 / (scale || 1)}"/>`;
    }).join('') : '';
    return `<g data-index="${index}"><polygon points="${polygon}" fill="${active ? 'rgba(37,99,235,.34)' : 'rgba(37,99,235,.18)'}" stroke="${active ? '#1d4ed8' : '#2563eb'}" stroke-width="${1 / (scale || 1)}"></polygon><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" fill="#fff" stroke="#0f172a" stroke-width="${4 / (scale || 1)}" paint-order="stroke" font-size="${16 / (scale || 1)}" font-family="PingFang SC, sans-serif">P${String(index + 1).padStart(2, '0')}</text>${handles}</g>`;
  }).join('');
  const draftMarkup = draft.length ? `<polyline points="${draft.map(px).map(point => point.join(',')).join(' ')}" fill="none" stroke="#c2410c" stroke-width="${1 / (scale || 1)}"></polyline>${draft.map(point => {
    const [x, y] = px(point);
    return `<circle cx="${x}" cy="${y}" r="${handle}" fill="#fff" stroke="#c2410c" stroke-width="${1 / (scale || 1)}"/>`;
  }).join('')}` : '';
  overlay.innerHTML = label + draftMarkup;
  countEl.innerHTML = `${slots.length}<small>个已画</small>`;
  copyBtn.disabled = selected < 0;
  undoBtn.disabled = !history.length;
  removeBtn.disabled = selected < 0;
  if (Number(totalEl.value) < slots.length) totalEl.value = String(slots.length);
  slotsEl.innerHTML = slots.map((slot, index) => `<button type="button" class="${index === selected ? 'selected' : ''}" data-select="${index}">P${String(index + 1).padStart(2, '0')}</button>`).join('') || '<p class="hint">还没有车位</p>';
}
function commitDraft() {
  slots.push({ points: draft });
  selected = slots.length - 1;
  draft = [];
  say(`P${String(selected + 1).padStart(2, '0')} 已画好。可拖动整块或角点，也可以复制到旁边。`);
  draw();
}
overlay.addEventListener('pointerdown', event => {
  if (!photo.naturalWidth) return;
  overlay.setPointerCapture(event.pointerId);
  const point = toImage(event.clientX, event.clientY);
  if (draft.length) {
    snapshot();
    draft.push(point);
    if (draft.length === 4) commitDraft();
    else { say(`已点 ${draft.length} 个角，还差 ${4 - draft.length} 个。按 Esc 可取消这一笔。`); draw(); }
    return;
  }
  const handle = nearestHandle(event.clientX, event.clientY);
  if (handle) {
    snapshot();
    drag = { kind: 'corner', ...handle, pointer: point };
    selected = handle.index;
    say('拖动角点，对准车位白线。');
    draw();
    return;
  }
  const index = stallAt(point);
  if (index >= 0) {
    snapshot();
    drag = { kind: 'move', index, pointer: point, origin: clone(slots[index].points) };
    selected = index;
    say('拖动整个车位。松开后位置就定下来。');
    draw();
    return;
  }
  snapshot();
  draft = [point];
  selected = -1;
  say('已点 1 个角，还差 3 个。');
  draw();
});
overlay.addEventListener('pointermove', event => {
  if (!drag) return;
  const point = toImage(event.clientX, event.clientY);
  if (drag.kind === 'corner') slots[drag.index].points[drag.vertex] = point;
  else {
    const dx = point[0] - drag.pointer[0], dy = point[1] - drag.pointer[1];
    slots[drag.index].points = drag.origin.map(([x, y]) => [Math.min(1, Math.max(0, x + dx)), Math.min(1, Math.max(0, y + dy))]);
  }
  draw();
});
overlay.addEventListener('pointerup', () => { drag = null; });
overlay.addEventListener('pointercancel', () => { drag = null; });
slotsEl.addEventListener('click', event => {
  const button = event.target.closest('[data-select]');
  if (!button) return;
  selected = Number(button.dataset.select);
  draft = [];
  say(`已选中 P${String(selected + 1).padStart(2, '0')}。`);
  draw();
});
copyBtn.addEventListener('click', () => {
  if (selected < 0) return;
  const step = sideStep(slots[selected].points);
  const moved = slots[selected].points.map(([x, y]) => [x + step[0], y + step[1]]);
  const center = moved.reduce((sum, point) => [sum[0] + point[0], sum[1] + point[1]], [0, 0]).map(value => value / 4);
  const others = slots.filter((_, index) => index !== selected);
  const nearest = others.map(slot => {
    const mid = slot.points.reduce((sum, point) => [sum[0] + point[0], sum[1] + point[1]], [0, 0]).map(value => value / 4);
    return Math.hypot(mid[0] - center[0], mid[1] - center[1]);
  });
  const flip = nearest.length && Math.min(...nearest) < Math.hypot(step[0], step[1]) * 0.6;
  const vector = flip ? [-step[0], -step[1]] : step;
  snapshot();
  slots.push({ points: slots[selected].points.map(([x, y]) => [Math.min(1, Math.max(0, x + vector[0])), Math.min(1, Math.max(0, y + vector[1]))]) });
  selected = slots.length - 1;
  say('已复制到旁边。位置不对就拖动整块。');
  draw();
});
undoBtn.addEventListener('click', () => {
  const previous = history.pop();
  if (!previous) return;
  slots = previous.slots;
  draft = previous.draft;
  selected = previous.selected;
  say('已撤销上一步。');
  draw();
});
removeBtn.addEventListener('click', () => {
  if (selected < 0) return;
  snapshot();
  slots.splice(selected, 1);
  selected = slots.length ? Math.min(selected, slots.length - 1) : -1;
  say(selected < 0 ? '已删除。可以重新点四个角。' : '已删除。');
  draw();
});
document.getElementById('keep').addEventListener('click', () => {
  const total = Number(totalEl.value);
  if (!Number.isInteger(total) || total < slots.length) { say(`可见车位总数要是整数，并且不少于已画的 ${slots.length} 个。`); return; }
  localStorage.setItem('seetime-parking-draw-try-v1', JSON.stringify({ slots, total, savedAt: new Date().toISOString() }));
  say(`已保存这张画面上的 ${slots.length} 个车位，可见总数 ${total}。这一页的记录不会写进平台。`);
});
totalEl.addEventListener('input', () => { if (slots.length && Number(totalEl.value) < slots.length) say(`总数不能少于已画的 ${slots.length} 个。`); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && draft.length) { snapshot(); draft = []; say('这一笔已取消。'); draw(); }
  else if ((event.key === 'Backspace' || event.key === 'Delete') && selected >= 0 && event.target !== totalEl) { event.preventDefault(); removeBtn.click(); }
  else if (event.key === 'z' && (event.metaKey || event.ctrlKey)) { event.preventDefault(); undoBtn.click(); }
});
function ready() { placeOverlay(); draw(); say('在车位的四个角上依次点击。'); }
photo.addEventListener('load', ready);
window.addEventListener('resize', draw);
if (photo.complete && photo.naturalWidth) ready();
</script>
</body>
</html>
